<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健康小忌</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* {
box-sizing: border-box;
    }
html, body {
margin: 0;
padding: 0;
overflow-x: hidden;
    }
body {
touch-action: pan-y;
/* 原图：左上白，右下角浅薄荷绿渐变 */
background: linear-gradient(to bottom, #f7e5ec 0%, #fff9f7 100%);
min-height:100vh;
    }
.icon-wrap {
width: clamp(60px, 16vw, 72px);
height: clamp(60px, 16vw, 72px);
    }
@media (max-width:400px) {
.icon-wrap {
width: clamp(50px,16vw,60px);
height: clamp(50px,16vw,60px);
      }
    }
.icon-item {
position: relative;
display: flex;
flex-direction: column;
align-items: center;
cursor: grab;
touch-action: pan-y;
user-select: none;
    }
.icon-item:active {
cursor: grabbing;
    }
.icon-item.dragging {
opacity: 0.4;
    }
.icon-item.drag-over {
outline: 2px dashed #ffffff;
outline-offset: 4px;
    }
.placeholder {
background: rgba(255,255,255,0.35);
border:1px dashed #fff;
border-radius: 8px;
    }
/* 减号按钮，和支付宝截图样式对齐，颜色不变 */
.minus-btn {
position: absolute;
top: -4px;
right: -4px;
width: 20px;
height: 20px;
background-color: #ef4444;
color: #ffffff;
border-radius: 999px;
display: none;
justify-content: center;
align-items: center;
font-weight: 500;
font-size:14px;
line-height:1;
text-align: center;
z-index: 10;
cursor: pointer;
    }
/* 加号按钮，和截图蓝色圆形加号样式，保留你原来的绿色底色 */
.plus-btn {
position: absolute;
top: -4px;
right: -4px;
width: 20px;
height: 20px;
background-color: #c8a2a8;
color: #ffffff;
border-radius: 999px;
display: none;
justify-content: center;
align-items: center;
font-weight: 500;
font-size:14px;
line-height:1;
text-align: center;
z-index: 10;
transition: background-color 0.2s;
cursor: pointer;
    }
.plus-btn.used {
background-color: #9ca3af;
pointer-events: none;
    }
.edit-mode .minus-btn {
display: flex;
    }
.edit-mode .plus-btn {
display: flex;
    }
/* ========== 左右移动箭头【放到文字左右，水平垂直居中对齐】 ========== */
.move-left, .move-right {
position: absolute;
top: 50%;
transform: translateY(-50%); /* 垂直居中核心 */
width: 16px; /* ← 箭头按钮整体宽度，调箭头大小 */
height:16px;/* ← 箭头按钮整体高度，调箭头大小 */
border-radius:999px;
background:#c8a2a8;
color:#fff;
border:none;
display:none;
justify-content:center;
align-items:center;
font-size:10px;/* ← 箭头符号「← →」文字字号，调箭头里面符号大小 */
cursor:pointer;
z-index:9;
}
.move-left {
left: -20px;  /* ← 控制左箭头距离文字的水平距离，数值越大离文字越远 */
}
.move-right {
right: -20px; /* ← 控制右箭头距离文字的水平距离，数值越大离文字越远 */
}
.move-left.hidden,
.move-right.hidden {
  display: none !important;
}
.edit-mode .move-left,
.edit-mode .move-right {
display:flex;
}
.common-list {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: clamp(8px,2vw,12px) clamp(6px,1.5vw,8px);
    }
.other-list {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: clamp(8px,2vw,12px) clamp(6px,1.5vw,8px);
    }
#backBtn {
width: 32px;
height: 32px;
border-radius: 999px;
border: 1px solid #d8b9c3;
background: transparent;
display:flex;
align-items:center;
justify-content:center;
color:#d8b9c3;
    }
#editBtn {
border:1px solid #d8b9c3;
background:rgba(255,255,255,0.7);
border-radius:999px;
color:#666;
    }
.header-wrap{
display:flex;
align-items:center;
justify-content:space-between;
position:relative;
margin-bottom:24px;
    }
.header-title{
position:absolute;
left:0;
right:0;
text-align:center;
z-index:0;
    }
.header-back{
z-index:1;
    }
/* 卡片样式：还原图片白色卡片+底部立体投影 */
.card-block{
border-radius: 2rem;
padding: clamp(14px,4vw,16px);
margin-bottom: clamp(12px,3vw,16px);
background-color: rgba(255, 255, 255, 0.88);
/* 多层阴影做出悬浮立体感 */
box-shadow: 0 10px 30px rgba(180,190,200,0.18),
0 4px 10px rgba(180,190,200,0.1);
    }
#noteInput {
border:1px solid #c8a2a8;
}
#noteInput:focus {
outline: none;
border-color: #c8a2a8;
box-shadow: 0 0 0 3px rgba(200, 162, 168, 0.35);
}
/* 超限提示弹窗 */
.tip-toast{
position: fixed;
left: 50%;
top: 45%;
transform: translate(-50%,-50%);
background: rgba(0,0,0,0.65);
color:#fff;
padding:12px 20px;
border-radius:12px;
font-size:14px;
z-index:9999;
opacity:0;
pointer-events:none;
transition:opacity 0.2s;
    }
.tip-toast.show{
opacity:1;
pointer-events:auto;
    }
/* 额外分类卡片，默认隐藏 */
.other-card {
display: none;
}
/* 编辑模式下显示 */
.edit-mode .other-card {
display: block;
}
.icon-item p {
color:#715d5c !important;
position:relative;
}
.card-block > div > span {
color:#715d5c !important;
}
.header-title h1{
color:#715d5c !important;
}
#noteCount{
color:#8c7877 !important;
}
</style>
</head>

<!-- 超限提示弹窗 -->
<div id="toast" class="tip-toast">仅能输入50个字符，超出部分无法保存</div>
<script>
const editBtn = document.getElementById('editBtn');
const backBtn = document.getElementById('backBtn');
const container = document.querySelector('.max-w-lg');
const commonListEl = document.getElementById('commonList');
const noteInput = document.getElementById('noteInput');
const noteCount = document.getElementById('noteCount');
const toast = document.getElementById('toast');
let isEditMode = false;
let placeholder = null;
const MAX_CHAR = 50;
let toastTimer = null;
// 更新左右箭头的隐藏状态
function updateArrowState(){
const items = Array.from(commonListEl.querySelectorAll('.icon-item'));
items.forEach((item,idx)=>{
const leftBtn = item.querySelector('.move-left');
const rightBtn = item.querySelector('.move-right');
// 清除旧hidden
leftBtn.classList.remove('hidden');
rightBtn.classList.remove('hidden');
// 第一项隐藏左箭头，最后一项隐藏右箭头
if(idx === 0){
  leftBtn.classList.add('hidden');
}
if(idx === items.length -1){
  rightBtn.classList.add('hidden');
}
})
}
// 弹出提示
function showToast() {
toast.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(()=>{
toast.classList.remove('show');
    },2000);
  }
// 备注输入拦截
noteInput.addEventListener('input', function(){
if(this.value.length > MAX_CHAR){
this.value = this.value.substring(0, MAX_CHAR);
showToast();
    }
noteCount.textContent = `${this.value.length}/${MAX_CHAR}`;
  })
function syncUsedStatus() {
const commonNames = [];
document.querySelectorAll('.common-list .icon-item').forEach(item=>{
commonNames.push(item.dataset.name);
    })
document.querySelectorAll('.other-list .icon-item').forEach(item=>{
const plusBtn = item.querySelector('.plus-btn');
if(commonNames.includes(item.dataset.name)){
plusBtn.classList.add('used');
      }else{
plusBtn.classList.remove('used');
      }
    })
updateArrowState();
  }
function createPlaceholder() {
const el = document.createElement('div');
el.className = "icon-item placeholder";
el.style.height = "110px";
return el;
  }
// 左右移动逻辑
commonListEl.addEventListener('click', function(e){
if(e.target.classList.contains('move-left')){
const item = e.target.closest('.icon-item');
const all = Array.from(commonListEl.querySelectorAll('.icon-item'));
const index = all.indexOf(item);
if(index <= 0) return;
const prevItem = all[index - 1];
commonListEl.insertBefore(item, prevItem);
updateArrowState();
}
if(e.target.classList.contains('move-right')){
const item = e.target.closest('.icon-item');
const all = Array.from(commonListEl.querySelectorAll('.icon-item'));
const index = all.indexOf(item);
if(index >= all.length -1) return;
const nextItem = all[index +1];
commonListEl.insertBefore(nextItem, item);
updateArrowState();
}
})
document.addEventListener('click', function(e){
if(e.target.classList.contains('minus-btn')){
const iconItem = e.target.closest('.icon-item');
const name = iconItem.dataset.name;
iconItem.remove();
syncUsedStatus();
    }
if(e.target.classList.contains('plus-btn') && !e.target.classList.contains('used')){
const sourceItem = e.target.closest('.icon-item');
const name = sourceItem.dataset.name;
const cloneItem = sourceItem.cloneNode(true);
cloneItem.setAttribute('draggable', 'true');
const plusInClone = cloneItem.querySelector('.plus-btn');
plusInClone.classList.remove('plus-btn');
plusInClone.classList.add('minus-btn');
plusInClone.textContent = '−';
const label = cloneItem.querySelector('p');
if(label) {
label.style.color = '#444';
// 自动注入左右箭头按钮
label.innerHTML = `<button class="move-left">←</button>${label.textContent}<button class="move-right">→</button>`;
}
commonListEl.appendChild(cloneItem);
bindDrag(cloneItem);
syncUsedStatus();
    }
  })
editBtn.addEventListener('click', ()=>{
isEditMode = !isEditMode;
if(isEditMode){
editBtn.innerText = "完成";
container.classList.add('edit-mode');
updateArrowState();
    }else{
editBtn.innerText = "编辑";
container.classList.remove('edit-mode');
    }
  })
function bindDrag(item){
let draggingEl = null;
item.addEventListener('dragstart', (e)=>{
draggingEl = item;
item.classList.add('dragging');
placeholder = createPlaceholder();
e.dataTransfer.effectAllowed = 'move';
    });
item.addEventListener('dragend', ()=>{
item.classList.remove('dragging');
if(placeholder && placeholder.parentNode) placeholder.remove();
placeholder = null;
draggingEl = null;
document.querySelectorAll('.icon-item').forEach(el=>el.classList.remove('drag-over'));
updateArrowState();
    });
item.addEventListener('dragover', (e)=>{
e.preventDefault();
if(!draggingEl || draggingEl === item) return;
if(placeholder && placeholder.parentNode) placeholder.remove();
item.parentNode.insertBefore(placeholder, item);
    });
item.addEventListener('drop', (e)=>{
e.preventDefault();
item.classList.remove('drag-over');
if(!draggingEl || draggingEl === item) return;
commonListEl.insertBefore(draggingEl, item);
if(placeholder && placeholder.parentNode) placeholder.remove();
updateArrowState();
    });
item.addEventListener('touchstart', (e)=>{
draggingEl = item;
item.classList.add('dragging');
placeholder = createPlaceholder();
    }, {passive: true});
item.addEventListener('touchmove', (e)=>{
if(!draggingEl || !placeholder) return;
const touch = e.touches[0];
const target = document.elementFromPoint(touch.clientX, touch.clientY);
const targetItem = target && target.closest('.icon-item');
if(targetItem && targetItem !== draggingEl){
if(placeholder.parentNode) placeholder.remove();
targetItem.parentNode.insertBefore(placeholder, targetItem);
      }
    }, {passive: true});
item.addEventListener('touchend', (e)=>{
if(!draggingEl || !placeholder) return;
const touch = e.changedTouches[0];
const target = document.elementFromPoint(touch.clientX, touch.clientY);
const targetItem = target && target.closest('.icon-item');
if(targetItem && targetItem !== draggingEl){
commonListEl.insertBefore(draggingEl, targetItem);
      }
if(placeholder && placeholder.parentNode) placeholder.remove();
draggingEl.classList.remove('dragging');
draggingEl = null;
updateArrowState();
    });
  }
document.querySelectorAll('.common-list .icon-item').forEach(bindDrag);
syncUsedStatus();
</script>
</body>
</html>
