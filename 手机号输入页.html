<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>输入手机号</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
html, body {
height: 100%;
background-color: #d2d0cf;
overflow: hidden;
        }
body {
display: flex;
flex-direction: column;
        }
.back-icon-wrap {
position:absolute;
top:48px;
left:20px;
        }
.back-btn {
width: 36px;
height: 36px;
border-radius: 50%;
border: 1px solid #cccccc;
display: flex;
align-items: center;
justify-content: center;
background: #fff;
cursor: pointer;
        }
.back-btn svg {
width: 18px;
height: 18px;
fill: #666;
        }
.container{
flex:1;
padding: 0 32px;
padding-top: 88px;
        }
.card-title {
font-size: 36px;
color: #ffffff;
font-weight: 600;
margin-bottom: 12px;
        }
.card-desc {
font-size: 20px;
color: #ffffff;
opacity: 0.9;
margin-bottom: 40px;
        }
.phone-input-wrap {
margin-bottom: 24px;
        }
.phone-input {
width: 100%;
height: 59px;
border-radius: 24px;
border: none;
font-size: 20px;
padding: 0 24px;
outline: none;
background: #ffffff;
        }
.get-code-btn {
width: 100%;
height: 48px;
border-radius: 999px;
border: none;
font-size: 18px;
color: #b8b8b8;
background: #ffffff;
cursor: pointer;
        }
.get-code-btn:disabled {
opacity: 0.7;
        }
/*==== 修改：半透明提示弹窗（无底部确认按钮，3秒自动消失）====*/
.modal-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.25);
z-index: 200;
display: none;
align-items: center;
justify-content: center;
}
.modal-wrap {
width: auto;
max-width: 280px;
background: rgba(0,0,0,0.65);
border-radius: 12px;
overflow: hidden;
padding:16px 24px;
}
.modal-body {
text-align: center;
}
.modal-msg-text {
font-size:17px;
font-weight:500;
color:#ffffff;
}
.modal-footer {
/* 隐藏底部按钮区域 */
display:none;
}
.modal-mask.show{
display:flex;
}
/*滑块验证弹窗*/
.slide-modal-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.45);
z-index: 210;
display: none;
align-items: center;
justify-content: center;
}
.slide-modal-wrap{
width:320px;
background:#fff;
border-radius:16px;
overflow:hidden;
}
.slide-modal-body{
padding:24px 20px;
}
.slide-title{
text-align:center;
font-size:18px;
color:#222;
margin-bottom:20px;
}
.slide-box{
width:100%;
height:44px;
background:#e8e8e8;
border-radius:22px;
position:relative;
overflow:hidden;
touch-action:none;
}
.slide-progress{
position:absolute;
left:0;
top:0;
height:100%;
background:#409eff;
width:0%;
}
.slide-btn{
width:44px;
height:44px;
border-radius:50%;
background:#fff;
box-shadow:0 0 3px #999;
position:absolute;
top:0;
left:0;
cursor:grab;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
user-select:none;
}
.slide-tip{
text-align:center;
margin-top:16px;
color:#666;
font-size:14px;
}
.slide-modal-mask.show{
display:flex;
}
</style>
</head>
<body>
<div class="back-icon-wrap">
<div class="back-btn" id="backBtn">
<svg viewBox="0 0 24 24">
<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
</svg>
</div>
</div>
<div class="container">
<div class="card-title">输入你的手机号</div>
<div class="card-desc">请输入你的手机号，点击获取验证码完成验证</div>
<div class="phone-input-wrap">
<input class="phone-input" id="phoneInput" placeholder="请输入手机号" maxlength="11" />
</div>
<button class="get-code-btn" id="getCodeBtn">获取验证码</button>
</div>
<!--普通提示弹窗（已移除确认按钮）-->
<div class="modal-mask" id="modalMask">
<div class="modal-wrap">
<div class="modal-body">
<div class="modal-msg-text" id="modalMsg"></div>
</div>
<div class="modal-footer">
<button class="modal-confirm-btn" id="modalOkBtn">确定</button>
</div>
</div>
</div>
<!--滑块人机验证弹窗-->
<div class="slide-modal-mask" id="slideModalMask">
<div class="slide-modal-wrap">
<div class="slide-modal-body">
<div class="slide-title">人机验证</div>
<div class="slide-box" id="slideBox">
<div class="slide-progress" id="slideProgress"></div>
<div class="slide-btn" id="slideBtn">→</div>
</div>
<div class="slide-tip" id="slideTip">请拖动滑块完成验证</div>
</div>
</div>
</div>
<script>
const phoneInput = document.getElementById('phoneInput');
const getCodeBtn = document.getElementById('getCodeBtn');
const modalMask = document.getElementById("modalMask");
const modalMsg = document.getElementById("modalMsg");
const modalOkBtn = document.getElementById("modalOkBtn");
const backBtn = document.getElementById("backBtn");
//滑块元素
const slideModalMask = document.getElementById("slideModalMask");
const slideBox = document.getElementById("slideBox");
const slideBtn = document.getElementById("slideBtn");
const slideProgress = document.getElementById("slideProgress");
const slideTip = document.getElementById("slideTip");
let slideVerified = false;
let isDrag = false;
let maxW = 0;
let targetPhone = "";
const ONE_HOUR = 60 * 60 * 1000;
// 手机号正则
const phoneReg = /^1(3[0-9]|4[579]|5[0-3,5-9]|6[2567]|7[0-8]|8[0-9]|9[0-3,5-9])\d{8}$/;
// 返回按钮跳转index.html
backBtn.addEventListener('click', ()=>{
location.href = "index.html";
});

let modalTimer = null;
function openModal(msg){
modalMsg.innerText = msg;
modalMask.classList.add("show");
// 清除旧定时器，防止多个弹窗叠加
if(modalTimer) clearTimeout(modalTimer);
modalTimer = setTimeout(()=>{
closeModal();
},3000);
}
function closeModal(){
if(modalTimer) clearTimeout(modalTimer);
modalMask.classList.remove("show");
}
function openSlideModal(){
slideVerified = false;
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "请拖动滑块完成验证";
slideTip.style.color="#666";
slideBtn.style.background="#fff";
slideModalMask.classList.add("show");
setTimeout(()=>{
maxW = slideBox.clientWidth - slideBtn.offsetWidth;
},10)
}
function closeSlideModal(){
slideModalMask.classList.remove("show");
}
//读取当前手机号一小时内发送记录
function getSmsRecords(phone){
const key = "sms_send_records_" + phone;
const raw = localStorage.getItem(key);
let list = raw ? JSON.parse(raw) : [];
const now = Date.now();
list = list.filter(ts => now - ts < ONE_HOUR);
localStorage.setItem(key, JSON.stringify(list));
return list;
}
//添加一条发送记录
function addSmsRecord(phone){
const key = "sms_send_records_" + phone;
const list = getSmsRecords(phone);
list.push(Date.now());
localStorage.setItem(key, JSON.stringify(list));
}
// 真正跳转验证码页面
function goVerifyPage(phone){
location.href = "验证码输入页.html?phone="+encodeURIComponent(phone);
}
getCodeBtn.addEventListener('click', ()=>{
const val = phoneInput.value.trim();
// 使用正则完整校验
if(!phoneReg.test(val)){
openModal("手机号格式不正确，请输入有效的11位中国大陆手机号");
return;
}
targetPhone = val;
const records = getSmsRecords(targetPhone);
// >=3次，弹出滑块验证
if(records.length >=3){
openSlideModal();
}else{
addSmsRecord(targetPhone);
goVerifyPage(targetPhone);
}
})
//滑块鼠标事件
slideBtn.addEventListener('mousedown',(e)=>{
isDrag = true;
e.preventDefault();
})
document.addEventListener('mousemove',(e)=>{
if(!isDrag) return;
const rect = slideBox.getBoundingClientRect();
let x = e.clientX - rect.left - slideBtn.offsetWidth/2;
if(x <0) x=0;
if(x>maxW) x = maxW;
slideBtn.style.left = x + "px";
let percent = (x/maxW)*100;
slideProgress.style.width = percent+"%";
})
document.addEventListener('mouseup',()=>{
if(!isDrag) return;
isDrag = false;
const leftVal = parseInt(slideBtn.style.left);
if(leftVal >= maxW*0.9){
slideVerified = true;
slideTip.textContent = "验证成功";
slideTip.style.color="#00c48c";
slideBtn.style.background="#00c48c";
setTimeout(()=>{
closeSlideModal();
addSmsRecord(targetPhone);
goVerifyPage(targetPhone);
},600)
}else{
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "验证失败，请重试";
slideTip.style.color="#f56c6c";
}
})
//移动端触摸
slideBtn.addEventListener('touchstart',(e)=>{
isDrag = true;
})
document.addEventListener('touchmove',(e)=>{
if(!isDrag) return;
e.preventDefault();
const rect = slideBox.getBoundingClientRect();
let x = e.touches[0].clientX - rect.left - slideBtn.offsetWidth/2;
if(x <0) x=0;
if(x>maxW) x = maxW;
slideBtn.style.left = x + "px";
let percent = (x/maxW)*100;
slideProgress.style.width = percent+"%";
},{passive:false})
document.addEventListener('touchend',()=>{
if(!isDrag) return;
isDrag = false;
const leftVal = parseInt(slideBtn.style.left);
if(leftVal >= maxW*0.9){
slideVerified = true;
slideTip.textContent = "验证成功";
slideTip.style.color="#00c48c";
slideBtn.style.background="#00c48c";
setTimeout(()=>{
closeSlideModal();
addSmsRecord(targetPhone);
goVerifyPage(targetPhone);
},600)
}else{
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "验证失败，请重试";
slideTip.style.color="#f56c6c";
}
})
// 移除确定按钮点击事件，不再需要
// modalOkBtn.addEventListener('click', closeModal);
modalMask.addEventListener('click',e=>{if(e.target===modalMask) closeModal();})
</script>
</body>
</html>
