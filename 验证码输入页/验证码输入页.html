<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>输入验证码</title>
<style>
/* 新增：根节点rem响应式，屏幕宽度动态设置字体基准，实现整体缩放 */
html {
  font-size: 100%;
}
@media screen and (max-width: 480px) {
  html {
    font-size: calc(100vw / 375 * 16);
  }
}
@media screen and (min-width: 481px) {
  html {
    font-size: 16px;
  }
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
html, body {
height: 100%;
/* 垂直渐变，顶部粉色，底部浅灰白，和截图一致 */
background: linear-gradient(180deg, #fcd7e1 0%, #f4f4f4 100%);
overflow: hidden;
}
body {
display: flex;
flex-direction: column;
}
/* 顶部返回 */
.top-bar {
padding: 2.5rem 1.25rem 0.625rem;
        }
.back-btn {
width: 2.25rem;
height: 2.25rem;
border-radius: 50%;
background: #ffffff;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
        }
.back-btn svg {
width: 1.125rem;
height: 1.125rem;
fill: #666666;
        }
/* 中间验证码区域 */
.verify-section {
flex: 1;
display: flex;
align-items: flex-start;
justify-content: center;
padding: 0 1.5rem;
margin-top: -0.25rem;
        }
.verify-card {
width: 100%;
max-width: 26.25rem;
padding: 1.125rem 1.5rem;
position: relative;
        }
.white-card-wrap {
background: rgba(255, 255, 255, 0.607);
border-radius: 1.5rem;
padding: 2rem 1.5rem;
box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.06);
}
.title-text {
font-size: clamp(2rem, 8vw, 2.125rem);
font-weight: 500;
color: #222;
margin-bottom: 0.5rem;
        }
.tip-text {
font-size: clamp(0.875rem,4vw,1.125rem);
color: #555;
opacity: 0.85;
margin-bottom: 1.75rem;
white-space: nowrap;
overflow: hidden;
}
/* 验证码输入框容器：增加will-change修复聚拢卡顿 */
.code-box-container {
display: flex;
gap: 1rem;
margin-bottom: 1.75rem;
position: relative;
justify-content: center;
transition: gap 0.5s ease;
will-change: transform;
        }
#hiddenInput{
position:absolute;
left:-9999px;
top:0;
width:7.5rem;
height:2.75rem;
z-index:-1;
}
.code-item {
flex: 1;
max-width: 4.5rem;
min-width: 3.25rem;
aspect-ratio: 1 / 1;
background: #ffffff;
border: 1.5px solid #c8b9a8;
border-radius: 0.75rem;
display: flex;
align-items: center;
justify-content: center;
font-size: clamp(1.75rem,7vw,2rem);
font-weight: 600;
color: #222;
position: relative;
cursor: pointer;
transition: transform 0.5s ease, opacity 0.4s ease, border-color 0.3s ease, border-width 0.3s ease;
overflow: hidden;
}
/* 当前激活位，粉色边框，平滑过渡 */
.code-item.active {
border-color: #eeb8c7;
}
.code-item.success-border {
border: 2px solid #00c48c !important;
}
/* 环形流星跑马灯，沿矩形边框顺时针流转，左深右浅 + 流星头部发光圆点 */
@property --angle {
syntax: '<angle>';
initial-value: 0deg;
inherits: false;
}
.code-item .item-light-border {
position: absolute;
inset: 0;
border-radius: 0.75rem;
pointer-events: none;
z-index: 5;
padding:2px;
background: conic-gradient(from var(--angle), transparent 0deg, #ffb8d2 0deg, #ff78a1 20deg, transparent 40deg);
-webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
-webkit-mask-composite: xor;
mask-composite: exclude;
animation: borderCircleFlow 1s linear 1;
}
/* 流星头部发光亮点 */
.code-item .item-light-border::after {
content:"";
position:absolute;
/* 放到流星头部（20度位置） */
--dot-angle: calc(var(--angle) + 20deg);
width:0.625rem;
height:0.625rem;
background: radial-gradient(circle, #ffb8d2 0%, rgba(255,120,161,0) 70%);
border-radius:50%;
/* 让圆点沿着盒子外圈旋转 */
offset-path: border-box;
offset-rotate: var(--dot-angle);
offset-distance: 0%;
animation: dotFollow 1s linear 2;
}
@keyframes borderCircleFlow {
from {
--angle: 0deg;
  }
to {
--angle: 360deg;
  }
}
@keyframes dotFollow {
from {
--angle: 0deg;
}
to {
--angle: 360deg;
}
}
@keyframes borderCircleFlow {
from {
--angle: 0deg;
  }
to {
--angle: 360deg;
  }
}
/* 四个框向中间聚拢成一个框 */
.code-item.merged {
transform: translateX(0) scale(0.85);
opacity: 1;
}
/* 聚拢完成后整体消失 */
.code-item.hidden {
opacity: 0;
pointer-events: none;
}
.code-item.active::after {
content: "";
position: absolute;
width: 2px;
height: 2rem;
background: #999;
animation: blink 1s infinite;
        }
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
        }
/* 成功状态【修改：去掉圆形边框、圆角】 */
.success-wrap{
position:absolute;
left:50%;
top:50%;
transform: translate(-50%,-50%);
width:auto;
height:auto;
background:transparent;
/* 删除 border 和 border-radius */
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition: opacity 0.45s ease;
z-index: 10;
}
.success-check{
color:#00c48c;
font-size: clamp(2.5rem, 10vw,3rem);
font-weight:bold;
opacity:0;
transition: opacity 0.4s ease 0.25s;
}
.success-text{
position:absolute;
top: 6.875rem;
left:50%;
transform:translateX(-50%);
font-size: clamp(1.125rem,4vw,1.375rem);
color:#ff78a1;
white-space:nowrap;
opacity:0;
transition: opacity 0.4s ease 0.45s;
}
/* 重新获取按钮 */
.resend-btn {
width: 100%;
padding: 1.125rem;
border-radius: 999px;
border: none;
font-size: clamp(1rem,4vw,1.25rem);
color: #fff;
background: #f788a8;
cursor: pointer;
transition: opacity 0.4s ease;
box-shadow: 0 0.25rem 0.75rem rgba(247,136,168,0.3);
        }
.resend-btn:disabled {
opacity: 0.7;
cursor: not-allowed;
background: #f788a8;
        }
/* 通用弹窗mask */
.modal-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.45);
z-index: 200;
display: none;
align-items: center;
justify-content: center;
padding: 0 1rem;
        }
.modal-wrap {
width: 100%;
max-width: 17.5rem;
background: #fff;
border-radius: 0.75rem;
overflow: hidden;
        }
.modal-body {
padding:1.5rem 1.25rem;
text-align: center;
        }
.modal-title {
font-size:1.0625rem;
color:#333;
margin-bottom:0.75rem;
        }
.modal-code-text {
font-size: clamp(1.75rem, 8vw,2rem);
letter-spacing:0.5rem;
font-weight:bold;
color:#222;
        }
.modal-tip-text {
font-size:1rem;
color:#ff78a1;
margin-top:0.625rem;
}
.modal-footer {
border-top:1px solid #eee;
        }
.modal-confirm-btn {
width:100%;
border:none;
background:#fff;
font-size:1.0625rem;
color:#007aff;
padding:0.875rem 0;
cursor:pointer;
        }
.modal-mask.show{
display:flex;
        }
/* ========= 拼图滑块验证弹窗【修复：拖拽拼块同步 + 响应式宽度】 ========= */
.slide-modal-wrap{
width:100%;
max-width: 20rem;
background:#fff;
border-radius:0.75rem;
overflow:hidden;
}
.slide-modal-body{
padding:1.25rem 1.25rem 1.5rem;
}
.slide-title{
text-align:center;
font-size:1.125rem;
color:#222;
margin-bottom:1rem;
}
/* 拼图画布容器 */
.puzzle-wrap{
width:100%;
aspect-ratio:320/180;
position:relative;
border-radius:0.5rem;
overflow:hidden;
}
/* 背景图片 */
.puzzle-bg-img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
}
/* 缺口 */
.puzzle-gap{
position:absolute;
top: 37.7%;
width: 16.875%;
aspect-ratio:1/1;
filter: drop-shadow(0 0.25rem 0.625rem rgba(0, 0, 0, 0.55)) drop-shadow(0 -0.125rem 0.25rem rgba(255, 255, 255, 0.25));
pointer-events:none;
}
.puzzle-gap svg{
width:100%;
height:100%;
overflow:visible;
}
.gap-path {
fill: rgba(0, 0, 0, 0.38);
}
/* 拖拽拼块 【移除默认transition】 */
.puzzle-block{
position:absolute;
top: 37.7%;
left:0px;
width: 16.875%;
aspect-ratio:1/1;
box-shadow: 0 0.375rem 0.875rem rgba(0, 0, 0, 0.6);
background-size: 100% 100%;
background-repeat: no-repeat;
clip-path: url(#dragClip);
outline: 2px solid #ffffff;
outline-offset: 1px;
}
/* SVG裁剪定义，放在画布左上角不可见 */
.puzzle-svg-def{
position:absolute;width:0;height:0;
}
/* 底部拖动条 */
.puzzle-slider-bar{
margin-top:0.875rem;
width:100%;
height:2.875rem;
background:#F8E5EB;
border-radius:1.5rem;
position:relative;
overflow:hidden;
touch-action:none;
}
.puzzle-slider-progress{
position:absolute;
left:0;
top:0;
height:100%;
background: linear-gradient(90deg, #F7C9D7, #F2A6BE);
border-radius:1.5rem;
width:0px;
}
.puzzle-slider-btn{
width:2.875rem;
height:2.875rem;
border-radius:50%;
background:#E888A6;
color:#fff;
box-shadow:0 0.25rem 0.75rem rgba(232, 136, 166, 0.45);
position:absolute;
top:0;
left:0px;
cursor:grab;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
user-select:none;
touch-action: none;
z-index:3;
}
.puzzle-slider-btn:active{
cursor:grabbing;
}
/* 拖拽中状态，取消过渡，实时跟随鼠标不卡顿 */
.puzzle-slider-bar.dragging .puzzle-slider-btn,
.puzzle-slider-bar.dragging .puzzle-slider-progress,
.puzzle-slider-bar.dragging .puzzle-block{
transition:none;
}
.slide-tip{
text-align:center;
margin-top:0.75rem;
font-size:0.875rem;
min-height:1.25rem;
}
.slide-success{ color: #38B075; }
.slide-error{ color: #E25C78; }
/* 校验结果提示浮窗：半透明，无按钮，自动消失 */
.toast-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
z-index: 300;
display: none;
align-items: center;
justify-content: center;
pointer-events: none;
padding:0 1rem;
}
.toast-box {
background:rgba(0,0,0,0.65);
color:#fff;
padding:1rem 1.75rem;
border-radius:0.75rem;
font-size:1.125rem;
animation:toastFade 0.3s ease;
}
@keyframes toastFade{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}
.toast-mask.show{
display:flex;
}
</style>
</head>
<body>
<div class="top-bar">
<div class="back-btn" id="backBtn">
<svg viewBox="0 0 24 24">
<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
</svg>
</div>
</div>
<div class="verify-section">
<div class="verify-card">
<div class="white-card-wrap">
<div class="title-text">输入验证码</div>
<div class="tip-text" id="tipText"></div>
<div class="code-box-container" id="codeContainer">
<input id="hiddenInput" type="text" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
<div class="code-item"></div>
<div class="code-item"></div>
<div class="code-item"></div>
<div class="code-item"></div>
<div class="success-wrap" id="successCircle">
<div class="success-check">✓</div>
</div>
<div class="success-text" id="successText"></div>
</div>
<button class="resend-btn" id="resendBtn">获取验证码</button>
</div>
</div>
</div>
<!-- 验证码弹窗（带确定按钮） -->
<div class="modal-mask" id="modalMask">
<div class="modal-wrap">
<div class="modal-body">
<div class="modal-title" id="modalTitle"></div>
<div class="modal-code-text" id="modalCodeVal"></div>
<div class="modal-tip-text" id="modalTip"></div>
</div>
<div class="modal-footer">
<button class="modal-confirm-btn" id="modalOkBtn">确定</button>
</div>
</div>
</div>
<!-- 【新版拼图滑块人机验证弹窗｜修复拖拽同步 + 响应式】 -->
<div class="modal-mask" id="slideModalMask">
<div class="slide-modal-wrap">
<div class="slide-modal-body">
<div class="slide-title">人机验证</div>
<!-- 拼图区域 -->
<div class="puzzle-wrap" id="puzzleWrap">
<img class="puzzle-bg-img" id="puzzleBgImg" alt="背景图">
<svg class="puzzle-svg-def">
<defs>
<clipPath id="dragClip">
<path id="dragPath"></path>
</clipPath>
</defs>
</svg>
<div class="puzzle-gap" id="puzzleGap">
<svg viewBox="0 0 54 54">
<path class="gap-path" id="gapPath"></path>
</svg>
</div>
<div class="puzzle-block" id="puzzleBlock"></div>
</div>
<!-- 底部拖动条 -->
<div class="puzzle-slider-bar" id="puzzleSliderBar">
<div class="puzzle-slider-progress" id="puzzleSliderProgress"></div>
<div class="puzzle-slider-btn" id="puzzleSliderBtn">≡</div>
</div>
<div class="slide-tip" id="slideTip">请拖动滑块完成验证</div>
</div>
</div>
</div>
<!-- 结果toast浮窗，3秒自动消失 -->
<div class="toast-mask" id="toastMask">
<div class="toast-box" id="toastText"></div>
</div>
<script>
//读取url参数拿到手机号、国家码
const urlParams = new URLSearchParams(location.search);
const phone = urlParams.get('phone') || '';
const countryCode = urlParams.get('country') || '+86';
const boxes = document.querySelectorAll(".code-item");
const hiddenInput = document.getElementById('hiddenInput');
const resendBtn = document.getElementById("resendBtn");
const tipText = document.querySelector(".tip-text");
const backBtn = document.getElementById("backBtn");
const modalMask = document.getElementById("modalMask");
const modalTitle = document.getElementById("modalTitle");
const modalCodeVal = document.getElementById("modalCodeVal");
const modalTip = document.getElementById("modalTip");
const modalOkBtn = document.getElementById("modalOkBtn");
// ========= 拼图验证相关变量【原版移植】 =========
const slideModalMask = document.getElementById("slideModalMask");
const puzzleWrap = document.getElementById("puzzleWrap");
const puzzleBgImg = document.getElementById("puzzleBgImg");
const puzzleGap = document.getElementById("puzzleGap");
const gapPathEl = document.getElementById("gapPath");
const dragPathEl = document.getElementById("dragPath");
const puzzleBlock = document.getElementById("puzzleBlock");
const puzzleSliderBar = document.getElementById("puzzleSliderBar");
const puzzleSliderProgress = document.getElementById("puzzleSliderProgress");
const puzzleSliderBtn = document.getElementById("puzzleSliderBtn");
const slideTip = document.getElementById("slideTip");
const PIECE_SIZE = 54;
let slideVerified = false;
let isDrag = false;
let targetLeft = 0;
let bgLoaded = false;
const TOLERANCE = 6;
//toast浮窗
const toastMask = document.getElementById("toastMask");
const toastText = document.getElementById("toastText");
const codeContainer = document.getElementById("codeContainer");
const successCircle = document.getElementById("successCircle");
const successCheck = document.querySelector(".success-check");
const successText = document.getElementById("successText");
let codeArr = ["", "", "", ""];
let pos = 0;
let timer = null;
let realVerifyCode = "";
let codeGenerateTime = 0;
let codeIsUsed = false;
let codeErrorCount = 0;
// 存储key：按手机号区分
const STORAGE_KEY = "sms_send_records_" + phone;
const CODE_CACHE_KEY = "current_code_" + phone;
const LOCK_KEY = "phone_lock_info_" + phone;
const ONE_HOUR = 60 * 60 * 1000;
const CODE_EXPIRE = 2 * 60 * 1000;
// 锁定信息读取
function getLockInfo(){
const raw = localStorage.getItem(LOCK_KEY);
if(!raw) return {globalFailCount:0, lockEndTs:0};
return JSON.parse(raw);
}
function saveLockInfo(obj){
localStorage.setItem(LOCK_KEY, JSON.stringify(obj));
}
// 检查当前是否锁定
function checkIsLocked(){
const lockInfo = getLockInfo();
const now = Date.now();
if(lockInfo.lockEndTs > now){
return {isLocked:true, remain: lockInfo.lockEndTs - now};
}
return {isLocked:false, remain:0};
}
// 计算下一次锁定时长
function getLockDuration(failCount){
if(failCount === 10) return 1 * 60 * 1000;
if(failCount === 11) return 5 * 60 * 1000;
if(failCount === 12) return 10 * 60 * 1000;
if(failCount >=13) return 30 * 60 * 1000;
return 0;
}
// 获取一小时内的发送记录
function getSmsRecords() {
const raw = localStorage.getItem(STORAGE_KEY);
let list = raw ? JSON.parse(raw) : [];
const now = Date.now();
list = list.filter(ts => now - ts < ONE_HOUR);
localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
return list;
}
// 添加本次发送记录
function addSmsRecord() {
const list = getSmsRecords();
list.push(Date.now());
localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
// 缓存验证码
function saveCodeCache(code, time, used, countStartTs, totalSec, codeErrCnt){
const cacheData = {
code: code,
generateTime: time,
used: used,
countStartTs: countStartTs,
totalSec: totalSec,
codeErrorCount: codeErrCnt
    }
localStorage.setItem(CODE_CACHE_KEY, JSON.stringify(cacheData));
}
//读取缓存验证码
function getCodeCache(){
const raw = localStorage.getItem(CODE_CACHE_KEY);
if(!raw) return null;
const obj = JSON.parse(raw);
const now = Date.now();
if(now - obj.generateTime > CODE_EXPIRE){
localStorage.removeItem(CODE_CACHE_KEY);
return null;
    }
return obj;
}
tipText.innerText = `验证码已发送至 ${countryCode} ${phone}`;
function renderCode(){
boxes.forEach((box,idx)=>{
box.innerText = codeArr[idx] || "";
box.classList.remove("active");
box.classList.remove("merged");
box.classList.remove("hidden");
})
// 当前光标位置单独激活粉色边框
if(pos < 4){
boxes[pos].classList.add("active");
}
}
boxes.forEach(box=>{
box.addEventListener('click',()=>{
hiddenInput.focus();
if(pos<4) boxes[pos].classList.add("active");
    })
})
// ✅验证成功动画：流星一圈 → 流星+文字 同步一起平滑淡出 → 四框聚拢倾斜 → 回正+绿边框 → 对勾弹出
async function runSuccessAnimation(){
// 验证码按钮渐隐
resendBtn.style.opacity = "0";
boxes.forEach(box => {
// 清理旧流星
let oldLight = box.querySelector('.item-light-border');
if(oldLight) oldLight.remove();
// 创建流星
let lightBorder = document.createElement('div');
lightBorder.className = 'item-light-border';
lightBorder.style.transition = 'opacity 0.35s ease';
lightBorder.style.opacity = '1';
box.appendChild(lightBorder);
// 文字颜色增加过渡，只控制文字透明度，盒子背景保持白色不变
box.style.transition = 'transform 0.5s ease, border-color 0.3s ease, color 0.35s ease';
box.style.color = 'rgba(34,34,34,1)';
});
await sleep(900);
// =========【核心改动：流星 和 数字文字 同步一起淡出】=========
boxes.forEach(box => {
//流星淡出
let light = box.querySelector('.item-light-border');
if(light) {
light.style.opacity = '0';
  }
//文字颜色透明度降到0，白底盒子保留不变
box.style.color = 'rgba(34,34,34,0)';
});
await sleep(350); //等待两者淡出动画结束
//流星DOM清理
boxes.forEach(box => {
let light = box.querySelector('.item-light-border');
if(light) light.remove();
});
// =========================================================
// 阶段1：聚拢 + 倾斜【动态读取盒子真实宽度，修复小屏幕聚拢过度bug】
codeContainer.style.gap = "0px";
// 获取单个验证码盒子真实宽度（响应式，不再写死72px）
const boxW = boxes[0].offsetWidth;
const centerIndex = 1.5;
boxes.forEach((box, idx) => {
const offset = (centerIndex - idx) * boxW;
let rotateDeg = 0;
if(idx === 0 || idx === 1){
rotateDeg = 20;
  }else if(idx === 2 || idx === 3){
rotateDeg = -20;
  }
box.style.transform = `translateX(${offset}px) scale(0.85) rotate(${rotateDeg}deg)`;
});
await sleep(500);
// 阶段2：旋转回正，添加绿色成功边框
boxes.forEach((box, idx) => {
const boxW = boxes[0].offsetWidth;
const centerIndex = 1.5;
const offset = (centerIndex - idx) * boxW;
box.style.transform = `translateX(${offset}px) scale(0.85) rotate(0deg)`;
box.style.borderWidth = "2px";
box.classList.add("success-border");
});
await sleep(300);
// 绿色对勾、提示文字渐显
successCircle.style.opacity = "1";
successCheck.style.opacity = "1";
successText.textContent = `欢迎回来`;
successText.style.color = "#00c48c";
successText.style.backgroundColor = "#ffffff";
successText.style.padding = "4px 14px";
successText.style.borderRadius = "999px";
successText.style.opacity = "1";
successText.style.width = "auto";
await sleep(1200);
// 跳转
location.href = "../常用项选择/常用项选择.html";
}
function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}
// ==========原版拼图凹凸形状生成函数 【移植】 =========
function generateRandomJigsawPath() {
const tabSize = 8;
const leftType = Math.floor(Math.random() * 3);
const rightType = Math.floor(Math.random() * 3);
let d = `M 10,8 L 44,8 `;
if (rightType === 0) {
d += `L 44,46`;
} else if (rightType === 1) {
d += `C ${44 + tabSize},22 ${44 + tabSize},32 44,46`;
} else {
d += `C ${44 - tabSize},22 ${44 - tabSize},32 44,46`;
}
d += ` L 10,46 `;
if (leftType === 0) {
d += `L 10,8`;
} else if (leftType === 1) {
d += `C ${10 - tabSize},32 ${10 - tabSize},22 10,8`;
} else {
d += `C ${10 + tabSize},32 ${10 + tabSize},22 10,8`;
}
d += ` Z`;
return d;
}
// 获取缺口目标X坐标
function getTargetPosition() {
const wrapW = puzzleWrap.clientWidth;
const minX = 24;
const maxX = wrapW - PIECE_SIZE - 24;
return Math.floor(Math.random() * (maxX - minX + 1)) + minX;
}
// 加载背景图片
function loadPuzzleBgImage() {
puzzleBgImg.src = `https://picsum.photos/id/${Math.floor(Math.random() * 1000)}/320/180`;
}
// 重置拼图弹窗内拼图【重置时恢复回弹过渡】
function resetSlidePuzzle() {
const path = generateRandomJigsawPath();
targetLeft = getTargetPosition();
gapPathEl.setAttribute("d", path);
dragPathEl.setAttribute("d", path);
puzzleGap.style.left = targetLeft + "px";
puzzleBlock.style.backgroundImage = `url(${puzzleBgImg.src})`;
puzzleBlock.style.backgroundPosition = `-${targetLeft}px -68px`;
puzzleSliderProgress.style.width = "46px";
// 重置回弹：开启过渡动画
puzzleBlock.style.transition = "left 0.18s ease";
puzzleSliderBtn.style.transition = "left 0.18s ease";
puzzleSliderProgress.style.transition = "width 0.18s ease";
puzzleBlock.style.left = "0px";
puzzleSliderBtn.style.left = "0px";
slideTip.className = "slide-tip";
slideTip.textContent = "请拖动滑块完成验证";
slideVerified = false;
isDrag = false;
puzzleSliderBar.classList.remove("dragging");
}
// 获取滑块最大可移动距离
function getSlideMaxLeft() {
return puzzleSliderBar.clientWidth - puzzleSliderBtn.clientWidth;
}
// ==========【输入校验逻辑】==========
hiddenInput.addEventListener('input',(e)=>{
let val = e.target.value.replace(/\D/g, '').slice(0,4);
e.target.value = val;
setTimeout(()=>{
hiddenInput.setSelectionRange(val.length, val.length);
    },0);
codeArr = ["","","",""];
for(let i=0; i<val.length; i++){
codeArr[i] = val[i];
    }
pos = val.length;
renderCode();
if(hiddenInput.matches(':focus') && pos<4){
boxes[pos].classList.add("active");
    }
//输入满4位自动校验
if(pos >=4){
hiddenInput.blur();
const inputCode = codeArr.join("");
const now = Date.now();
const lockInfo = getLockInfo();
const lockStatus = checkIsLocked();
if(lockStatus.isLocked){
showToast(`账号锁定中，请等待${Math.ceil(lockStatus.remain/1000)}秒后重试`);
resetInput();
return;
}
if(now - codeGenerateTime > CODE_EXPIRE){
showToast("当前验证码已失效请重新获取");
resetInput();
return;
}
if(codeIsUsed){
showToast("当前验证码已失效请重新获取");
resetInput();
return;
}
if(codeErrorCount >=5){
showToast("当前验证码错误次数过多，请重新获取");
resetInput();
return;
}
if(inputCode === realVerifyCode){
codeIsUsed = true;
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, cacheCode?.countStartTs||Date.now(), cacheCode?.totalSec||60, codeErrorCount);
let lockData = getLockInfo();
lockData.globalFailCount = 0;
lockData.lockEndTs = 0;
saveLockInfo(lockData);
runSuccessAnimation();
}else{
codeErrorCount++;
let lockData = getLockInfo();
lockData.globalFailCount +=1;
const newGlobalFail = lockData.globalFailCount;
const lockDur = getLockDuration(newGlobalFail);
if(lockDur>0){
lockData.lockEndTs = Date.now() + lockDur;
}
saveLockInfo(lockData);
if(newGlobalFail >=6 && newGlobalFail <10){
const remainTry = 10 - newGlobalFail;
showToast(`验证码错误，还可尝试${remainTry}次后账户将被锁定1分钟`);
}else{
showToast("验证码错误");
}
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, cacheCode?.countStartTs||Date.now(), cacheCode?.totalSec||60, codeErrorCount);
resetInput();
}
}
})
function resetInput(){
codeArr = ["","","",""];
pos =0;
hiddenInput.value = "";
renderCode();
// 重置成功动画状态，清除每个框内部流星边框
codeContainer.style.gap = "16px";
boxes.forEach(b=>{
b.style.transform = "";
b.style.color = "rgba(34,34,34,1)";
b.style.opacity = "1";
b.style.borderWidth = "1.5px"; //恢复默认1.5px边框
b.classList.remove('hidden');
b.classList.remove('success-border'); //新增：移除成功绿色边框
let oldLight = b.querySelector('.item-light-border');
if(oldLight) oldLight.remove();
});
successCircle.style.opacity = "0";
successCheck.style.opacity = "0";
successText.style.opacity = "0";
// 重置按钮透明度
resendBtn.style.opacity = "1";
}
hiddenInput.addEventListener("focus", ()=>{
setTimeout(()=>{
hiddenInput.setSelectionRange(hiddenInput.value.length, hiddenInput.value.length);
renderCode();
    },0)
})
//退格处理
hiddenInput.addEventListener('keydown',(e)=>{
if(e.key === 'Backspace'){
if(pos>0){
pos--;
codeArr[pos] = "";
renderCode();
if(hiddenInput.matches(':focus') && pos<4){
boxes[pos].classList.add("active");
            }
        }
    }
})
//打开普通弹窗
function openModal(type, codeText=""){
modalTitle.innerText = "";
modalCodeVal.innerText = "";
modalTip.innerText = "";
if(type === "code"){
modalTitle.innerText = "您的本次验证码";
modalCodeVal.innerText = codeText;
modalTip.innerText = "请在2分钟内完成验证";
            }
modalMask.classList.add("show");
        }
function closeModal(){
modalMask.classList.remove("show");
        }
//打开拼图滑块弹窗
function openSlideModal(){
slideModalMask.classList.add("show");
bgLoaded = false;
loadPuzzleBgImage();
puzzleBgImg.onload = ()=>{
bgLoaded = true;
resetSlidePuzzle();
};
}
function closeSlideModal(){
slideModalMask.classList.remove("show");
}
function showToast(msg){
toastText.innerText = msg;
toastMask.classList.add("show");
setTimeout(()=>{
toastMask.classList.remove("show");
},3000);
}
// 生成4位随机数字验证码
function generate4Code() {
return String(Math.floor(1000 + Math.random() * 9000));
}
function startCountdown(startTs, totalSeconds) {
clearInterval(timer);
const now = Date.now();
const elapsed = Math.floor((now - startTs)/1000);
let remain = totalSeconds - elapsed;
if(remain <=0){
resendBtn.disabled = false;
resendBtn.innerText = "获取验证码";
return;
    }
resendBtn.disabled = true;
resendBtn.innerText = `重新获取 (${remain})`;
timer = setInterval(()=>{
remain--;
resendBtn.innerText = `重新获取 (${remain})`;
if(remain <=0){
clearInterval(timer);
resendBtn.disabled = false;
resendBtn.innerText = "获取验证码";
        }
    },1000);
}
// ==========页面初始化逻辑==========
const initRecords = getSmsRecords();
const cacheCode = getCodeCache();
if(cacheCode){
realVerifyCode = cacheCode.code;
codeGenerateTime = cacheCode.generateTime;
codeIsUsed = cacheCode.used;
codeErrorCount = cacheCode.codeErrorCount || 0;
console.log("复用缓存验证码：", realVerifyCode);
startCountdown(cacheCode.countStartTs, cacheCode.totalSec);
}else{
realVerifyCode = generate4Code();
codeGenerateTime = Date.now();
codeIsUsed = false;
codeErrorCount = 0;
const totalSec = initRecords.length >5 ? 120 :60;
const countStartTs = Date.now();
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, countStartTs, totalSec, codeErrorCount);
console.log("新生成验证码：", realVerifyCode);
addSmsRecord();
startCountdown(countStartTs, totalSec);
openModal("code", realVerifyCode);
}
renderCode();
backBtn.addEventListener('click',()=>{
location.href = "../手机号输入页/手机号输入页.html";
})
// ===================== 拼图拖拽逻辑【修复同步】 =====================
puzzleSliderBtn.addEventListener('mousedown',startDragSlide);
puzzleSliderBtn.addEventListener('touchstart',startDragSlide);
function startDragSlide(e){
isDrag = true;
slideTip.textContent = "";
puzzleSliderBar.classList.add("dragging");
e.preventDefault();
}
document.addEventListener("mousemove", onSlideDrag);
document.addEventListener("touchmove", onSlideDrag, { passive: false });
function onSlideDrag(e){
if (!isDrag) return;
e.preventDefault();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const rect = puzzleSliderBar.getBoundingClientRect();
let moveX = clientX - rect.left - puzzleSliderBtn.clientWidth / 2;
const maxLeft = getSlideMaxLeft();
if (moveX < 0) moveX = 0;
if (moveX > maxLeft) moveX = maxLeft;
//拖拽移动时强制关闭过渡，三者完全同步
puzzleBlock.style.transition = "none";
puzzleSliderBtn.style.transition = "none";
puzzleSliderProgress.style.transition = "none";
// 更新滑块按钮位置
puzzleSliderBtn.style.left = `${moveX}px`;
// 更新拼图块位置
puzzleBlock.style.left = `${moveX}px`;
// 进度条右边缘对齐圆形滑块右边缘 moveX + 46px
puzzleSliderProgress.style.width = `${moveX + 46}px`;
}
document.addEventListener("mouseup", endSlideDrag);
document.addEventListener("touchend", endSlideDrag);
function endSlideDrag() {
if (!isDrag) return;
isDrag = false;
puzzleSliderBar.classList.remove("dragging");
const currentX = parseFloat(puzzleSliderBtn.style.left) || 0;
if (Math.abs(currentX - targetLeft) <= TOLERANCE) {
slideVerified = true;
slideTip.className = "slide-tip slide-success";
slideTip.textContent = "✅ 验证成功";
setTimeout(() => {
closeSlideModal();
doSendCode();
},600);
} else {
slideTip.className = "slide-tip slide-error";
slideTip.textContent = "❌ 验证失败，请重试";
setTimeout(() => {
resetSlidePuzzle();
},1200);
}
}
//执行发送验证码逻辑
function doSendCode(){
const lockStatus = checkIsLocked();
if(lockStatus.isLocked){
const sec = Math.ceil(lockStatus.remain / 1000);
showToast(`账号锁定中，还需等待${sec}秒才能获取验证码`);
return;
}
const records = getSmsRecords();
realVerifyCode = generate4Code();
codeGenerateTime = Date.now();
codeIsUsed = false;
codeErrorCount = 0;
const totalSec = records.length >5 ?120:60;
const countStartTs = Date.now();
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, countStartTs, totalSec, codeErrorCount);
openModal("code", realVerifyCode);
console.log("重发验证码：",realVerifyCode);
addSmsRecord();
codeArr = ["","","",""];
pos=0;
hiddenInput.value = "";
hiddenInput.blur();
renderCode();
startCountdown(countStartTs, totalSec);
}
// 点击【重新获取】
resendBtn.addEventListener('click', ()=>{
if(resendBtn.disabled) return;
const lockStatus = checkIsLocked();
if(lockStatus.isLocked){
const sec = Math.ceil(lockStatus.remain / 1000);
showToast(`账号锁定中，还需等待${sec}秒才能获取验证码`);
return;
}
const records = getSmsRecords();
if(records.length >=3){
openSlideModal();
return;
}
doSendCode();
})
modalOkBtn.addEventListener('click', closeModal);
modalMask.addEventListener('click',function(e){
if(e.target === modalMask){
closeModal();
            }
        })
hiddenInput.addEventListener("blur", ()=>{
boxes.forEach(box => box.classList.remove("active"));
})
</script>
