<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>输入验证码</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
html, body {
height: 100%;
background-color: #cccccc;
overflow: hidden;
        }
body {
display: flex;
flex-direction: column;
        }
/* 顶部返回 */
.top-bar {
background-color: #cccccc;
padding: 40px 20px 10px;
        }
.back-btn {
width: 36px;
height: 36px;
border-radius: 50%;
background: #ffffff;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
        }
.back-btn svg {
width: 18px;
height: 18px;
fill: #666666;
        }
/* 中间验证码区域 */
.verify-section {
flex: 1;
display: flex;
align-items: flex-start;
justify-content: center;
background-color: #cccccc;
padding: 0 24px;
margin-top: -4px;
        }
.verify-card {
width: 100%;
max-width: 420px;
background: #cccccc;
padding: 18px 24px;
        }
.title-text {
font-size: 34px;
font-weight: 500;
color: #ffffff;
margin-bottom: 8px;
        }
.tip-text {
font-size: 18px;
color: #ffffff;
opacity: 0.85;
margin-bottom: 28px;
        }
/* 验证码输入框容器 */
.code-box-container {
display: flex;
gap: 16px;
margin-bottom: 28px;
position:relative;
        }
/* ===== 修复：移出屏幕而不是透明1px ===== */
#hiddenInput{
position:absolute;
left:-9999px;
top:0;
width:120px;
height:44px;
z-index:-1;
}
.code-item {
flex: 1;
aspect-ratio: 1 / 1;
background: #ffffff;
border: 3px solid #fff;
border-radius: 20px;
display: flex;
align-items: center;
justify-content: center;
font-size: 32px;
font-weight: 600;
color: #222;
position: relative;
cursor: pointer;
transition: 0.2s;
        }
/* 仅当前格子触发粉色闪光动画 */
.code-item.flash {
animation: flashPink 0.25s ease-out;
}
@keyframes flashPink {
0% {
border-color: #ffb8d2;
transform: scale(1.06);
}
100% {
border-color: #ffffff;
transform: scale(1);
}
}
.code-item.active::after {
content: "";
position: absolute;
width: 2px;
height: 32px;
background: #999;
animation: blink 1s infinite;
        }
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
        }
/* 重新获取按钮 */
.resend-btn {
width: 100%;
padding: 18px;
border-radius: 999px;
border: none;
font-size: 20px;
color: #aaaaaa;
background: #ffffff;
cursor: pointer;
transition: 0.2s;
        }
.resend-btn:disabled {
opacity: 0.7;
cursor: not-allowed;
        }
/* 通用弹窗mask */
.modal-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.45);
z-index: 200;
display: none;
align-items: center;
justify-content: center;
        }
.modal-wrap {
width: 280px;
background: #fff;border-radius: 16px;
overflow: hidden;
        }
.modal-body {
padding: 24px 20px;
text-align: center;
        }
.modal-title {
font-size:17px;
color:#333;
margin-bottom:12px;
        }
.modal-code-text {
font-size:32px;
letter-spacing:8px;
font-weight:bold;
color:#222;
        }
.modal-tip-text {
font-size:16px;
color:#ff78a1;
margin-top:10px;
}
.modal-footer {
border-top:1px solid #eee;
        }
.modal-confirm-btn {
width:100%;
border:none;
background:#fff;
font-size:17px;
color:#007aff;
padding:14px 0;
cursor:pointer;
        }
.modal-mask.show{
display:flex;
        }
/* 滑块验证弹窗 */
.slide-modal-wrap{
width:320px;
background:#fff;
border-radius:16px;
overflow:hidden;
}
.slide-modal-body{
padding:24px 20px;
}
.slide-title{
text-align:center;
font-size:18px;
color:#222;
margin-bottom:20px;
}
.slide-box{
width:100%;
height:44px;
background:#e8e8e8;
border-radius:22px;
position:relative;
overflow:hidden;
touch-action:none;
}
.slide-progress{
position:absolute;
left:0;
top:0;
height:100%;
background:#409eff;
width:0%;
}
.slide-btn{
width:44px;
height:44px;
border-radius:50%;
background:#fff;
box-shadow:0 0 3px #999;
position:absolute;
top:0;
left:0;
cursor:grab;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
user-select:none;
}
.slide-tip{
text-align:center;
margin-top:16px;
color:#666;
font-size:14px;
}
/* 校验结果提示浮窗：半透明，无按钮，自动消失 */
.toast-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
z-index: 300;
display: none;
align-items: center;
justify-content: center;
pointer-events: none;
}
.toast-box {
background:rgba(0,0,0,0.65);
color:#fff;
padding:16px 28px;
border-radius:12px;
font-size:18px;
animation:toastFade 0.3s ease;
}
@keyframes toastFade{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}
.toast-mask.show{
display:flex;
}
</style>
</head>
<body>
<div class="top-bar">
<div class="back-btn" id="backBtn">
<svg viewBox="0 0 24 24">
<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
</svg>
</div>
</div>
<div class="verify-section">
<div class="verify-card">
<div class="title-text">输入验证码</div>
<div class="tip-text" id="tipText"></div>
<div class="code-box-container">
<input id="hiddenInput" type="text" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
<div class="code-item"></div>
<div class="code-item"></div>
<div class="code-item"></div>
<div class="code-item"></div>
</div>
<button class="resend-btn" id="resendBtn">获取验证码</button>
</div>
</div>
<!-- 验证码弹窗（带确定按钮） -->
<div class="modal-mask" id="modalMask">
<div class="modal-wrap">
<div class="modal-body">
<div class="modal-title" id="modalTitle"></div>
<div class="modal-code-text" id="modalCodeVal"></div>
<div class="modal-tip-text" id="modalTip"></div>
</div>
<div class="modal-footer">
<button class="modal-confirm-btn" id="modalOkBtn">确定</button>
</div>
</div>
</div>
<!-- 滑块人机验证弹窗 -->
<div class="modal-mask" id="slideModalMask">
<div class="slide-modal-wrap">
<div class="slide-modal-body">
<div class="slide-title">人机验证</div>
<div class="slide-box" id="slideBox">
<div class="slide-progress" id="slideProgress"></div>
<div class="slide-btn" id="slideBtn">→</div>
</div>
<div class="slide-tip" id="slideTip">请拖动滑块完成验证</div>
</div>
</div>
</div>
<!-- 结果toast浮窗，3秒自动消失 -->
<div class="toast-mask" id="toastMask">
<div class="toast-box" id="toastText"></div>
</div>
<script>
//读取url参数拿到手机号
const urlParams = new URLSearchParams(location.search);
const phone = urlParams.get('phone') || '';
const boxes = document.querySelectorAll(".code-item");
const hiddenInput = document.getElementById('hiddenInput');
const resendBtn = document.getElementById("resendBtn");
const tipText = document.querySelector(".tip-text");
const backBtn = document.getElementById("backBtn");
const modalMask = document.getElementById("modalMask");
const modalTitle = document.getElementById("modalTitle");
const modalCodeVal = document.getElementById("modalCodeVal");
const modalTip = document.getElementById("modalTip");
const modalOkBtn = document.getElementById("modalOkBtn");
//滑块验证
const slideModalMask = document.getElementById("slideModalMask");
const slideBox = document.getElementById("slideBox");
const slideBtn = document.getElementById("slideBtn");
const slideProgress = document.getElementById("slideProgress");
const slideTip = document.getElementById("slideTip");
let slideVerified = false;
let isDrag = false;
let maxW = 0; // 最大拖动距离，打开弹窗后再计算
//toast浮窗
const toastMask = document.getElementById("toastMask");
const toastText = document.getElementById("toastText");
let codeArr = ["", "", "", ""];
let pos = 0;
let timer = null;
let realVerifyCode = "";
let codeGenerateTime = 0;
let codeIsUsed = false; //标记验证码是否已经使用成功一次
// 存储key：按手机号区分，不同手机号独立计数
const STORAGE_KEY = "sms_send_records_" + phone;
const CODE_CACHE_KEY = "current_code_" + phone;
const ONE_HOUR = 60 * 60 * 1000;
const CODE_EXPIRE = 2 * 60 * 1000; //验证码2分钟有效期
// 获取一小时内的发送记录
function getSmsRecords() {
const raw = localStorage.getItem(STORAGE_KEY);
let list = raw ? JSON.parse(raw) : [];
const now = Date.now();
// 过滤掉超过1小时的记录
list = list.filter(ts => now - ts < ONE_HOUR);
localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
return list;
}
// 添加本次发送记录
function addSmsRecord() {
const list = getSmsRecords();
list.push(Date.now());
localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
// 缓存验证码 + 倒计时信息 + 首次跳转标记
function saveCodeCache(code, time, used, countStartTs, totalSec, isFirstJump){
const cacheData = {
code: code,
generateTime: time,
used: used,
countStartTs: countStartTs,
totalSec: totalSec,
isFirstJump: isFirstJump
    }
localStorage.setItem(CODE_CACHE_KEY, JSON.stringify(cacheData));
}
//读取缓存验证码
function getCodeCache(){
const raw = localStorage.getItem(CODE_CACHE_KEY);
if(!raw) return null;
const obj = JSON.parse(raw);
const now = Date.now();
//超过2分钟验证码失效，清空缓存
if(now - obj.generateTime > CODE_EXPIRE){
localStorage.removeItem(CODE_CACHE_KEY);
return null;
    }
return obj;
}
tipText.innerText = "验证码已发送至 +86 " + phone;
// 更新格子显示+光标位置
function renderCode(){
boxes.forEach((box,idx)=>{
box.innerText = codeArr[idx] || "";
box.classList.remove("active");
    })
}
// 只给指定索引格子触发粉色闪光特效
function triggerFlash(index){
const box = boxes[index];
box.classList.remove('flash');
void box.offsetWidth;
box.classList.add('flash');
}
// 点击验证码格子，唤起原生键盘
boxes.forEach(box=>{
box.addEventListener('click',()=>{
hiddenInput.focus();
if(pos<4) boxes[pos].classList.add("active");
    })
})
// ==========【修复后的输入监听】==========
hiddenInput.addEventListener('input',(e)=>{
    let val = e.target.value.replace(/\D/g, '').slice(0,4);
    e.target.value = val;
    // 强制光标到末尾
    setTimeout(()=>{
        hiddenInput.setSelectionRange(val.length, val.length);
    },0);

    codeArr = ["","","",""];
    for(let i=0; i<val.length; i++){
        codeArr[i] = val[i];
        triggerFlash(i);
    }
    pos = val.length;
    renderCode();

    if(hiddenInput.matches(':focus') && pos<4){
        boxes[pos].classList.add("active");
    }
    //输入满4位自动校验
    if(pos >=4){
        hiddenInput.blur();
        const inputCode = codeArr.join("");
        const now = Date.now();
        const twoMinute = 2 * 60 * 1000;
        if(codeIsUsed){
            showToast("当前验证码已失效请重新获取");
        }else if(inputCode === realVerifyCode){
            if(now - codeGenerateTime > twoMinute){
                showToast("当前验证码已失效请重新获取");
            }else{
                showToast(`欢迎回来 ${phone}`);
                codeIsUsed = true;
                saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, Date.now(), 60, false);
            }
        }else{
            showToast("验证码错误");
            codeArr = ["","","",""];
            pos =0;
            hiddenInput.value = "";
            renderCode();
        }
    }
})
// 聚焦时自动把光标放到末尾
hiddenInput.addEventListener("focus", ()=>{
    setTimeout(()=>{
        hiddenInput.setSelectionRange(hiddenInput.value.length, hiddenInput.value.length);
    },0)
})
//退格处理
hiddenInput.addEventListener('keydown',(e)=>{
if(e.key === 'Backspace'){
if(pos>0){
pos--;
codeArr[pos] = "";
triggerFlash(pos);
renderCode();
if(hiddenInput.matches(':focus') && pos<4){
boxes[pos].classList.add("active");
            }
        }
    }
})
//打开普通弹窗
function openModal(type, codeText=""){
modalTitle.innerText = "";
modalCodeVal.innerText = "";
modalTip.innerText = "";
if(type === "code"){
modalTitle.innerText = "您的本次验证码";
modalCodeVal.innerText = codeText;
modalTip.innerText = "请在2分钟内完成验证";
            }
modalMask.classList.add("show");
        }
function closeModal(){
modalMask.classList.remove("show");
        }
//打开滑块弹窗【修复重点：打开弹窗后再计算宽度】
function openSlideModal(){
slideVerified = false;
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "请拖动滑块完成验证";
slideTip.style.color="#666";
slideBtn.style.background="#fff";
slideModalMask.classList.add("show");
// 弹窗显示后，再获取滑块盒子尺寸
setTimeout(()=>{
maxW = slideBox.clientWidth - slideBtn.offsetWidth;
},10)
}
function closeSlideModal(){
slideModalMask.classList.remove("show");
}
//toast提示：半透明，3秒自动消失
function showToast(msg){
toastText.innerText = msg;
toastMask.classList.add("show");
setTimeout(()=>{
toastMask.classList.remove("show");
},3000);
}
// 生成4位随机数字验证码
function generate4Code() {
return String(Math.floor(1000 + Math.random() * 9000));
}
/**
 * 支持断点续倒计时
 * startTs: 倒计时开始时间戳
 * totalSeconds: 总秒数(60/120)
 */
function startCountdown(startTs, totalSeconds) {
clearInterval(timer);
const now = Date.now();
const elapsed = Math.floor((now - startTs)/1000);
let remain = totalSeconds - elapsed;
if(remain <=0){
resendBtn.disabled = false;
resendBtn.innerText = "获取验证码";
return;
    }
resendBtn.disabled = true;
resendBtn.innerText = `重新获取 (${remain})`;
timer = setInterval(()=>{
remain--;
resendBtn.innerText = `重新获取 (${remain})`;
if(remain <=0){
clearInterval(timer);
resendBtn.disabled = false;
resendBtn.innerText = "获取验证码";
        }
    },1000);
}
// ==========页面初始化逻辑==========
const initRecords = getSmsRecords();
const cacheCode = getCodeCache();
if(cacheCode){
// 存在缓存 = 刷新页面，复用旧验证码，续倒计时，**不自动弹窗**
realVerifyCode = cacheCode.code;
codeGenerateTime = cacheCode.generateTime;
codeIsUsed = cacheCode.used;
console.log("复用缓存验证码：", realVerifyCode);
startCountdown(cacheCode.countStartTs, cacheCode.totalSec);
}else{
// 无缓存：第一次从手机号页面跳转进来，弹窗，标记首次跳转
realVerifyCode = generate4Code();
codeGenerateTime = Date.now();
codeIsUsed = false;
const totalSec = initRecords.length >5 ? 120 :60;
const countStartTs = Date.now();
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, countStartTs, totalSec, false);
console.log("新生成验证码：", realVerifyCode);
addSmsRecord(); //仅首次跳转才计入发送次数
startCountdown(countStartTs, totalSec);
openModal("code", realVerifyCode);
}
renderCode();
// 返回按钮，跳回手机号页面
backBtn.addEventListener('click',()=>{
location.href = "手机号输入页.html";
})
// ========== 滑块拖拽逻辑 ==========
slideBtn.addEventListener('mousedown',(e)=>{
isDrag = true;
e.preventDefault();
})
document.addEventListener('mousemove',(e)=>{
if(!isDrag) return;
const rect = slideBox.getBoundingClientRect();
let x = e.clientX - rect.left - slideBtn.offsetWidth/2;
if(x <0) x=0;
if(x>maxW) x = maxW;
slideBtn.style.left = x + "px";
let percent = (x/maxW)*100;
slideProgress.style.width = percent+"%";
})
document.addEventListener('mouseup',()=>{
if(!isDrag) return;
isDrag = false;
const leftVal = parseInt(slideBtn.style.left);
if(leftVal >= maxW*0.9){
slideVerified = true;
slideTip.textContent = "验证成功";
slideTip.style.color="#00c48c";
slideBtn.style.background="#00c48c";
setTimeout(()=>{
closeSlideModal();
doSendCode();
},600)
}else{
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "验证失败，请重试";
slideTip.style.color="#f56c6c";
}
})
//移动端触摸
slideBtn.addEventListener('touchstart',(e)=>{
isDrag = true;
})
document.addEventListener('touchmove',(e)=>{
if(!isDrag) return;
e.preventDefault();
const rect = slideBox.getBoundingClientRect();
let x = e.touches[0].clientX - rect.left - slideBtn.offsetWidth/2;
if(x <0) x=0;
if(x>maxW) x = maxW;
slideBtn.style.left = x + "px";
let percent = (x/maxW)*100;
slideProgress.style.width = percent+"%";
},{passive:false})
document.addEventListener('touchend',()=>{
if(!isDrag) return;
isDrag = false;
const leftVal = parseInt(slideBtn.style.left);
if(leftVal >= maxW*0.9){
slideVerified = true;
slideTip.textContent = "验证成功";
slideTip.style.color="#00c48c";
slideBtn.style.background="#00c48c";
setTimeout(()=>{
closeSlideModal();
doSendCode();
},600)
}else{
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "验证失败，请重试";
slideTip.style.color="#f56c6c";
}
})
//执行发送验证码逻辑
function doSendCode(){
const records = getSmsRecords();
realVerifyCode = generate4Code();
codeGenerateTime = Date.now();
codeIsUsed = false;
const totalSec = records.length >5 ?120:60;
const countStartTs = Date.now();
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, countStartTs, totalSec, false);
openModal("code", realVerifyCode);
console.log("重发验证码：",realVerifyCode);
addSmsRecord();
codeArr = ["","","",""];
pos=0;
hiddenInput.value = "";
hiddenInput.blur();
renderCode();
startCountdown(countStartTs, totalSec);
}
// 点击【重新获取】
resendBtn.addEventListener('click', ()=>{
if(resendBtn.disabled) return;
const records = getSmsRecords();
if(records.length >=3){
openSlideModal();
return;
}
doSendCode();
})
modalOkBtn.addEventListener('click', closeModal);
modalMask.addEventListener('click',function(e){
if(e.target === modalMask){
closeModal();
            }
        })
hiddenInput.addEventListener("blur", ()=>{
boxes.forEach(box => box.classList.remove("active"));
})
</script>
</body>
</html>
