<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>输入验证码</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
html, body {
height: 100%;
background-color: #cccccc;
overflow: hidden;
        }
body {
display: flex;
flex-direction: column;
        }
/* 顶部返回 */
.top-bar {
background-color: #cccccc;
padding: 40px 20px 10px;
        }
.back-btn {
width: 36px;
height: 36px;
border-radius: 50%;
background: #ffffff;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
        }
.back-btn svg {
width: 18px;
height: 18px;
fill: #666666;
        }
/* 中间验证码区域 */
.verify-section {
flex: 1;
display: flex;
align-items: flex-start;
justify-content: center;
background-color: #cccccc;
padding: 0 24px;
margin-top: -4px;
        }
.verify-card {
width: 100%;
max-width: 420px;
background: #cccccc;
padding: 18px 24px;
position: relative;
        }
.title-text {
font-size: 34px;
font-weight: 500;
color: #ffffff;
margin-bottom: 8px;
        }
.tip-text {
font-size: clamp(14px,4vw,18px);
color: #ffffff;
opacity: 0.85;
margin-bottom: 28px;
white-space: nowrap;
overflow: hidden;
}
/* 验证码输入框容器：增加will-change修复聚拢卡顿 */
.code-box-container {
display: flex;
gap: 16px;
margin-bottom: 28px;
position: relative;
justify-content: center;
transition: gap 0.5s ease;
will-change: transform;
        }
#hiddenInput{
position:absolute;
left:-9999px;
top:0;
width:120px;
height:44px;
z-index:-1;
}
.code-item {
flex: 1;
max-width: 72px;
aspect-ratio: 1 / 1;
background: #ffffff;
border: 3px solid #fff;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 32px;
font-weight: 600;
color: #222;
position: relative;
cursor: pointer;
transition: transform 0.5s ease, opacity 0.4s ease, border-color 0.3s ease;
overflow: hidden;
        }
/* 单个输入框独立流星跑马灯：仅边框线条显示流星，内部完全不显示 */

.code-item .item-light-border {
position: absolute;
inset: 0;
border-radius: 12px; /* 和.code-item圆角保持一致！ */
pointer-events: none;
z-index: 5;
background: conic-gradient(from 0deg, transparent 0deg, #ff78a1 0deg, #ffb8d2 15deg, #ff78a1 30deg, transparent 30deg);
animation: itemLightRotate 0.5s linear 2;

mask-image:
  linear-gradient(#000 0 0),
  linear-gradient(#000 0 0);
mask-clip: border-box, border-box;
mask-composite: exclude;
mask-size: 100% 100%, calc(100% - 4px) calc(100% - 4px);
mask-position: center, center;
mask-repeat: no-repeat;
mask-border-radius: 12px; /* 内层挖空圆角，和外层一致 */

-webkit-mask-image:
  linear-gradient(#000 0 0),
  linear-gradient(#000 0 0);
-webkit-mask-clip: border-box, border-box;
-webkit-mask-composite: xor;
-webkit-mask-size: 100% 100%, calc(100% - 4px) calc(100% - 4px);
-webkit-mask-position: center, center;
-webkit-mask-repeat: no-repeat;
-webkit-mask-border-radius: 12px;
}




@keyframes itemLightRotate {
0% {
transform: rotate(0deg);
}
100% {
transform: rotate(360deg);
}
}
.code-item.flash {
animation: flashPink 0.7s ease-out;
}
@keyframes flashPink {
0% {
border-color: #ffb8d2;
transform: scale(1.06);
}
100% {
border-color: #ffffff;
transform: scale(1);
}
}
/* 四个框向中间聚拢成一个框 */
.code-item.merged {
transform: translateX(0) scale(0.85);
opacity: 1;
}
/* 聚拢完成后整体消失 */
.code-item.hidden {
opacity: 0;
pointer-events: none;
}
.code-item.active::after {
content: "";
position: absolute;
width: 2px;
height: 32px;
background: #999;
animation: blink 1s infinite;
        }
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
        }
/* 成功状态 */
.success-wrap{
position:absolute;
left:50%;
top:50%;
transform: translate(-50%,-50%);
width:72px;
height:72px;
border-radius:50%;
background:#00c48c;
border: 4px solid #fff;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition: opacity 0.45s ease;
z-index: 10;
}
.success-check{
color:#fff;
font-size:40px;
font-weight:bold;
opacity:0;
transition: opacity 0.4s ease 0.25s;
}
.success-text{
position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);
font-size:22px;
color:#ff78a1;
white-space:nowrap;
opacity:0;
transition: opacity 0.4s ease 0.45s;
}
/* 重新获取按钮 */
.resend-btn {
width: 100%;
padding: 18px;
border-radius: 999px;
border: none;
font-size: 20px;
color: #aaaaaa;
background: #ffffff;
cursor: pointer;
transition: opacity 0.4s ease;
        }
.resend-btn:disabled {
opacity: 0.7;
cursor: not-allowed;
        }
/* 通用弹窗mask */
.modal-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.45);
z-index: 200;
display: none;
align-items: center;
justify-content: center;
        }
.modal-wrap {
width: 280px;
background: #fff;
border-radius: 12px;
overflow: hidden;
        }
.modal-body {
padding: 24px 20px;
text-align: center;
        }
.modal-title {
font-size:17px;
color:#333;
margin-bottom:12px;
        }
.modal-code-text {
font-size:32px;
letter-spacing:8px;
font-weight:bold;
color:#222;
        }
.modal-tip-text {
font-size:16px;
color:#ff78a1;
margin-top:10px;
}
.modal-footer {
border-top:1px solid #eee;
        }
.modal-confirm-btn {
width:100%;
border:none;
background:#fff;
font-size:17px;
color:#007aff;
padding:14px 0;
cursor:pointer;
        }
.modal-mask.show{
display:flex;
        }
/* 滑块验证弹窗 */
.slide-modal-wrap{
width:320px;
background:#fff;
border-radius:12px;
overflow:hidden;
}
.slide-modal-body{
padding:24px 20px;
}
.slide-title{
text-align:center;
font-size:18px;
color:#222;
margin-bottom:20px;
}
.slide-box{
width:100%;
height:44px;
background:#e8e8e8;
border-radius:12px;
position:relative;
overflow:hidden;
touch-action:none;
}
.slide-progress{
position:absolute;
left:0;
top:0;
height:100%;
background:#409eff;
width:0%;
}
.slide-btn{
width:44px;
height:44px;
border-radius:50%;
background:#fff;
box-shadow:0 0 3px #999;
position:absolute;
top:0;
left:0;
cursor:grab;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
user-select:none;
}
.slide-tip{
text-align:center;
margin-top:16px;
color:#666;
font-size:14px;
}
/* 校验结果提示浮窗：半透明，无按钮，自动消失 */
.toast-mask {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
z-index: 300;
display: none;
align-items: center;
justify-content: center;
pointer-events: none;
}
.toast-box {
background:rgba(0,0,0,0.65);
color:#fff;
padding:16px 28px;
border-radius:12px;
font-size:18px;
animation:toastFade 0.3s ease;
}
@keyframes toastFade{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}
.toast-mask.show{
display:flex;
}
</style>
</head>
<body>
<div class="top-bar">
<div class="back-btn" id="backBtn">
<svg viewBox="0 0 24 24">
<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
</svg>
</div>
</div>
<div class="verify-section">
<div class="verify-card">
<div class="title-text">输入验证码</div>
<div class="tip-text" id="tipText"></div>
<div class="code-box-container" id="codeContainer">
<input id="hiddenInput" type="text" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
<div class="code-item"></div>
<div class="code-item"></div>
<div class="code-item"></div>
<div class="code-item"></div>
<div class="success-wrap" id="successCircle">
<div class="success-check">✓</div>
</div>
<div class="success-text" id="successText"></div>
</div>
<button class="resend-btn" id="resendBtn">获取验证码</button>
</div>
</div>
<!-- 验证码弹窗（带确定按钮） -->
<div class="modal-mask" id="modalMask">
<div class="modal-wrap">
<div class="modal-body">
<div class="modal-title" id="modalTitle"></div>
<div class="modal-code-text" id="modalCodeVal"></div>
<div class="modal-tip-text" id="modalTip"></div>
</div>
<div class="modal-footer">
<button class="modal-confirm-btn" id="modalOkBtn">确定</button>
</div>
</div>
</div>
<!-- 滑块人机验证弹窗 -->
<div class="modal-mask" id="slideModalMask">
<div class="slide-modal-wrap">
<div class="slide-modal-body">
<div class="slide-title">人机验证</div>
<div class="slide-box" id="slideBox">
<div class="slide-progress" id="slideProgress"></div>
<div class="slide-btn" id="slideBtn">→</div>
</div>
<div class="slide-tip" id="slideTip">请拖动滑块完成验证</div>
</div>
</div>
</div>
<!-- 结果toast浮窗，3秒自动消失 -->
<div class="toast-mask" id="toastMask">
<div class="toast-box" id="toastText"></div>
</div>
<script>
//读取url参数拿到手机号、国家码
const urlParams = new URLSearchParams(location.search);
const phone = urlParams.get('phone') || '';
const countryCode = urlParams.get('country') || '+86';
const boxes = document.querySelectorAll(".code-item");
const hiddenInput = document.getElementById('hiddenInput');
const resendBtn = document.getElementById("resendBtn");
const tipText = document.querySelector(".tip-text");
const backBtn = document.getElementById("backBtn");
const modalMask = document.getElementById("modalMask");
const modalTitle = document.getElementById("modalTitle");
const modalCodeVal = document.getElementById("modalCodeVal");
const modalTip = document.getElementById("modalTip");
const modalOkBtn = document.getElementById("modalOkBtn");
//滑块验证
const slideModalMask = document.getElementById("slideModalMask");
const slideBox = document.getElementById("slideBox");
const slideBtn = document.getElementById("slideBtn");
const slideProgress = document.getElementById("slideProgress");
const slideTip = document.getElementById("slideTip");
let slideVerified = false;
let isDrag = false;
let maxW = 0;
//toast浮窗
const toastMask = document.getElementById("toastMask");
const toastText = document.getElementById("toastText");
const codeContainer = document.getElementById("codeContainer");
const successCircle = document.getElementById("successCircle");
const successCheck = document.querySelector(".success-check");
const successText = document.getElementById("successText");
let codeArr = ["", "", "", ""];
let pos = 0;
let timer = null;
let realVerifyCode = "";
let codeGenerateTime = 0;
let codeIsUsed = false;
let codeErrorCount = 0;
// 存储key：按手机号区分
const STORAGE_KEY = "sms_send_records_" + phone;
const CODE_CACHE_KEY = "current_code_" + phone;
const LOCK_KEY = "phone_lock_info_" + phone;
const ONE_HOUR = 60 * 60 * 1000;
const CODE_EXPIRE = 2 * 60 * 1000;
// 锁定信息读取
function getLockInfo(){
const raw = localStorage.getItem(LOCK_KEY);
if(!raw) return {globalFailCount:0, lockEndTs:0};
return JSON.parse(raw);
}
function saveLockInfo(obj){
localStorage.setItem(LOCK_KEY, JSON.stringify(obj));
}
// 检查当前是否锁定
function checkIsLocked(){
const lockInfo = getLockInfo();
const now = Date.now();
if(lockInfo.lockEndTs > now){
return {isLocked:true, remain: lockInfo.lockEndTs - now};
}
return {isLocked:false, remain:0};
}
// 计算下一次锁定时长
function getLockDuration(failCount){
if(failCount === 10) return 1 * 60 * 1000;
if(failCount === 11) return 5 * 60 * 1000;
if(failCount === 12) return 10 * 60 * 1000;
if(failCount >=13) return 30 * 60 * 1000;
return 0;
}
// 获取一小时内的发送记录
function getSmsRecords() {
const raw = localStorage.getItem(STORAGE_KEY);
let list = raw ? JSON.parse(raw) : [];
const now = Date.now();
list = list.filter(ts => now - ts < ONE_HOUR);
localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
return list;
}
// 添加本次发送记录
function addSmsRecord() {
const list = getSmsRecords();
list.push(Date.now());
localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
// 缓存验证码
function saveCodeCache(code, time, used, countStartTs, totalSec, codeErrCnt){
const cacheData = {
code: code,
generateTime: time,
used: used,
countStartTs: countStartTs,
totalSec: totalSec,
codeErrorCount: codeErrCnt
    }
localStorage.setItem(CODE_CACHE_KEY, JSON.stringify(cacheData));
}
//读取缓存验证码
function getCodeCache(){
const raw = localStorage.getItem(CODE_CACHE_KEY);
if(!raw) return null;
const obj = JSON.parse(raw);
const now = Date.now();
if(now - obj.generateTime > CODE_EXPIRE){
localStorage.removeItem(CODE_CACHE_KEY);
return null;
    }
return obj;
}
tipText.innerText = `验证码已发送至 ${countryCode} ${phone}`;
function renderCode(){
boxes.forEach((box,idx)=>{
box.innerText = codeArr[idx] || "";
box.classList.remove("active");
box.classList.remove("merged");
box.classList.remove("hidden");
    })
}
function triggerFlash(index){
const box = boxes[index];
box.classList.remove('flash');
void box.offsetWidth;
box.classList.add('flash');
}
boxes.forEach(box=>{
box.addEventListener('click',()=>{
hiddenInput.focus();
if(pos<4) boxes[pos].classList.add("active");
    })
})
// ✅验证成功动画：四个输入框各自同时播放粉色流星跑马灯一圈 → 四框聚拢
async function runSuccessAnimation(){
// 【新增】验证码按钮渐隐
resendBtn.style.opacity = "0";

// 【改动】给每一个输入框单独创建流星边框，4个同时开始旋转
boxes.forEach(box => {
// 清理残留旧流星元素
let oldLight = box.querySelector('.item-light-border');
if(oldLight) oldLight.remove();
let lightBorder = document.createElement('div');
lightBorder.className = 'item-light-border';
box.appendChild(lightBorder);
});
await sleep(900);
// 2. 四个输入框向中心点聚拢（只做一次位移，之后位置固定不动）
codeContainer.style.gap = "0px";
boxes.forEach((box, idx) => {
const centerIndex = 1.5;
const offset = (centerIndex - idx) * 72;
box.style.transform = `translateX(${offset}px) scale(0.85)`;
box.style.opacity = "1";
    });
await sleep(500);
// 3. 保持聚拢位置不变，仅透明度淡出
boxes.forEach(box => {
box.style.opacity = "0";
    });
await sleep(400);
// 4. 绿色圆形对勾渐显
successCircle.style.opacity = "1";
successCheck.style.opacity = "1";
// 绿勾出现后，绿色欢迎文字渐显 ${phone}
successText.textContent = `欢迎回来`;
successText.style.color = "#00c48c";
successText.style.backgroundColor = "#ffffff";
successText.style.padding = "4px 14px";
successText.style.borderRadius = "999px";
successText.style.opacity = "1";
successText.style.width = "auto";

await sleep(1200);
// 5. 跳转
location.href = "常用项选择.html";
}
function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}
// ==========【输入校验逻辑】==========
hiddenInput.addEventListener('input',(e)=>{
let val = e.target.value.replace(/\D/g, '').slice(0,4);
e.target.value = val;
setTimeout(()=>{
hiddenInput.setSelectionRange(val.length, val.length);
    },0);
codeArr = ["","","",""];
for(let i=0; i<val.length; i++){
codeArr[i] = val[i];
triggerFlash(i);
    }
pos = val.length;
renderCode();
if(hiddenInput.matches(':focus') && pos<4){
boxes[pos].classList.add("active");
    }
//输入满4位自动校验
if(pos >=4){
hiddenInput.blur();
const inputCode = codeArr.join("");
const now = Date.now();
const lockInfo = getLockInfo();
const lockStatus = checkIsLocked();
if(lockStatus.isLocked){
showToast(`账号锁定中，请等待${Math.ceil(lockStatus.remain/1000)}秒后重试`);
resetInput();
return;
}
if(now - codeGenerateTime > CODE_EXPIRE){
showToast("当前验证码已失效请重新获取");
resetInput();
return;
}
if(codeIsUsed){
showToast("当前验证码已失效请重新获取");
resetInput();
return;
}
if(codeErrorCount >=5){
showToast("当前验证码错误次数过多，请重新获取");
resetInput();
return;
}
if(inputCode === realVerifyCode){
codeIsUsed = true;
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, cacheCode?.countStartTs||Date.now(), cacheCode?.totalSec||60, codeErrorCount);
let lockData = getLockInfo();
lockData.globalFailCount = 0;
lockData.lockEndTs = 0;
saveLockInfo(lockData);
runSuccessAnimation();
}else{
codeErrorCount++;
let lockData = getLockInfo();
lockData.globalFailCount +=1;
const newGlobalFail = lockData.globalFailCount;
const lockDur = getLockDuration(newGlobalFail);
if(lockDur>0){
lockData.lockEndTs = Date.now() + lockDur;
}
saveLockInfo(lockData);
if(newGlobalFail >=6 && newGlobalFail <10){
const remainTry = 10 - newGlobalFail;
showToast(`验证码错误，还可尝试${remainTry}次后账户将被锁定1分钟`);
}else{
showToast("验证码错误");
}
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, cacheCode?.countStartTs||Date.now(), cacheCode?.totalSec||60, codeErrorCount);
resetInput();
}
}
})
function resetInput(){
codeArr = ["","","",""];
pos =0;
hiddenInput.value = "";
renderCode();
// 重置成功动画状态，清除每个框内部流星边框
codeContainer.style.gap = "16px";
boxes.forEach(b=>{
b.style.transform = "";
b.style.opacity = "1";
b.classList.remove('hidden');
let oldLight = b.querySelector('.item-light-border');
if(oldLight) oldLight.remove();
});
successCircle.style.opacity = "0";
successCheck.style.opacity = "0";
successText.style.opacity = "0";
// 重置按钮透明度
resendBtn.style.opacity = "1";
}
hiddenInput.addEventListener("focus", ()=>{
setTimeout(()=>{
hiddenInput.setSelectionRange(hiddenInput.value.length, hiddenInput.value.length);
    },0)
})
//退格处理
hiddenInput.addEventListener('keydown',(e)=>{
if(e.key === 'Backspace'){
if(pos>0){
pos--;
codeArr[pos] = "";
triggerFlash(pos);
renderCode();
if(hiddenInput.matches(':focus') && pos<4){
boxes[pos].classList.add("active");
            }
        }
    }
})
//打开普通弹窗
function openModal(type, codeText=""){
modalTitle.innerText = "";
modalCodeVal.innerText = "";
modalTip.innerText = "";
if(type === "code"){
modalTitle.innerText = "您的本次验证码";
modalCodeVal.innerText = codeText;
modalTip.innerText = "请在2分钟内完成验证";
            }
modalMask.classList.add("show");
        }
function closeModal(){
modalMask.classList.remove("show");
        }
//打开滑块弹窗
function openSlideModal(){
slideVerified = false;
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "请拖动滑块完成验证";
slideTip.style.color="#666";
slideBtn.style.background="#fff";
slideModalMask.classList.add("show");
setTimeout(()=>{
maxW = slideBox.clientWidth - slideBtn.offsetWidth;
},10)
}
function closeSlideModal(){
slideModalMask.classList.remove("show");
}
function showToast(msg){
toastText.innerText = msg;
toastMask.classList.add("show");
setTimeout(()=>{
toastMask.classList.remove("show");
},3000);
}
// 生成4位随机数字验证码
function generate4Code() {
return String(Math.floor(1000 + Math.random() * 9000));
}
function startCountdown(startTs, totalSeconds) {
clearInterval(timer);
const now = Date.now();
const elapsed = Math.floor((now - startTs)/1000);
let remain = totalSeconds - elapsed;
if(remain <=0){
resendBtn.disabled = false;
resendBtn.innerText = "获取验证码";
return;
    }
resendBtn.disabled = true;
resendBtn.innerText = `重新获取 (${remain})`;
timer = setInterval(()=>{
remain--;
resendBtn.innerText = `重新获取 (${remain})`;
if(remain <=0){
clearInterval(timer);
resendBtn.disabled = false;
resendBtn.innerText = "获取验证码";
        }
    },1000);
}
// ==========页面初始化逻辑==========
const initRecords = getSmsRecords();
const cacheCode = getCodeCache();
if(cacheCode){
realVerifyCode = cacheCode.code;
codeGenerateTime = cacheCode.generateTime;
codeIsUsed = cacheCode.used;
codeErrorCount = cacheCode.codeErrorCount || 0;
console.log("复用缓存验证码：", realVerifyCode);
startCountdown(cacheCode.countStartTs, cacheCode.totalSec);
}else{
realVerifyCode = generate4Code();
codeGenerateTime = Date.now();
codeIsUsed = false;
codeErrorCount = 0;
const totalSec = initRecords.length >5 ? 120 :60;

// ========== 滑块拖拽逻辑 ==========
slideBtn.addEventListener('mousedown',(e)=>{
isDrag = true;
e.preventDefault();
})
document.addEventListener('mousemove',(e)=>{
if(!isDrag) return;
const rect = slideBox.getBoundingClientRect();
let x = e.clientX - rect.left - slideBtn.offsetWidth/2;
if(x <0) x=0;
if(x>maxW) x = maxW;
slideBtn.style.left = x + "px";
let percent = (x/maxW)*100;
slideProgress.style.width = percent+"%";
})
document.addEventListener('mouseup',()=>{
if(!isDrag) return;
isDrag = false;
const leftVal = parseInt(slideBtn.style.left);
if(leftVal >= maxW*0.9){
slideVerified = true;
slideTip.textContent = "验证成功";
slideTip.style.color="#00c48c";
slideBtn.style.background="#00c48c";
setTimeout(()=>{
closeSlideModal();
doSendCode();
},600)
}else{
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "验证失败，请重试";
slideTip.style.color="#f56c6c";
}
})
//移动端触摸
slideBtn.addEventListener('touchstart',(e)=>{
isDrag = true;
})
document.addEventListener('touchmove',(e)=>{
if(!isDrag) return;
e.preventDefault();
const rect = slideBox.getBoundingClientRect();
let x = e.touches[0].clientX - rect.left - slideBtn.offsetWidth/2;
if(x <0) x=0;
if(x>maxW) x = maxW;
slideBtn.style.left = x + "px";
let percent = (x/maxW)*100;
slideProgress.style.width = percent+"%";
},{passive:false})
document.addEventListener('touchend',()=>{
if(!isDrag) return;
isDrag = false;
const leftVal = parseInt(slideBtn.style.left);
if(leftVal >= maxW*0.9){
slideVerified = true;
slideTip.textContent = "验证成功";
slideTip.style.color="#00c48c";
slideBtn.style.background="#00c48c";
setTimeout(()=>{
closeSlideModal();
doSendCode();
},600)
}else{
slideBtn.style.left = "0px";
slideProgress.style.width = "0%";
slideTip.textContent = "验证失败，请重试";
slideTip.style.color="#f56c6c";
}
})
//执行发送验证码逻辑
function doSendCode(){
const lockStatus = checkIsLocked();
if(lockStatus.isLocked){
const sec = Math.ceil(lockStatus.remain / 1000);
showToast(`账号锁定中，还需等待${sec}秒才能获取验证码`);
return;
}
const records = getSmsRecords();
realVerifyCode = generate4Code();
codeGenerateTime = Date.now();
codeIsUsed = false;
codeErrorCount = 0;
const totalSec = records.length >5 ?120:60;
const countStartTs = Date.now();
saveCodeCache(realVerifyCode, codeGenerateTime, codeIsUsed, countStartTs, totalSec, codeErrorCount);
openModal("code", realVerifyCode);
console.log("重发验证码：",realVerifyCode);
addSmsRecord();
codeArr = ["","","",""];
pos=0;
hiddenInput.value = "";
hiddenInput.blur();
renderCode();
startCountdown(countStartTs, totalSec);
}
// 点击【重新获取】
resendBtn.addEventListener('click', ()=>{
if(resendBtn.disabled) return;
const lockStatus = checkIsLocked();
if(lockStatus.isLocked){
const sec = Math.ceil(lockStatus.remain / 1000);
showToast(`账号锁定中，还需等待${sec}秒才能获取验证码`);
return;
}
const records = getSmsRecords();
if(records.length >=3){
openSlideModal();
return;
}
doSendCode();
})

            }

boxes.forEach(box => box.classList.remove("active"));
})
