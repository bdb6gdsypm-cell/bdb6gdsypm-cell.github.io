<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>登录</title>
<link rel="stylesheet" href="https://at.alicdn.com/t/font_3317792_2i4l7xcq66k.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
html, body {
height: 100vh;
height: 100svh;
overflow: hidden;
    }
body {
background:
url('bg.jpg') center top / cover no-repeat,
linear-gradient(160deg, #f8d2e0, #e1eaf8, #ffffff, #fce4ec);
padding: 24px;
padding-bottom: calc(24px + env(safe-area-inset-bottom));
position: relative;
    }
body::before {
content: "";
position: absolute;
inset: 0;
background: url('girl.png') center top / contain no-repeat;
background-position: 50% 6%;
pointer-events: none;
z-index: 0;
    }
.login-wrap {
height: 100%;
max-width: 420px;
margin: 0 auto;
position: relative;
z-index: 1;
display: flex;
flex-direction: column;
    }
.close-btn {
font-size: 32px;
color: #d86898;
text-decoration: none;
margin-bottom: 16px;
    }
.title h1 {
font-size: 56px;
font-weight: 600;
color: #222;
line-height: 1.1;
    }
.title p {
font-size: 20px;
color: #333;
margin-top: 6px;
    }
.space {
flex: 1;
min-height: 60px;
    }
/* 下半部分整体下移10px，原30 → 40px */
.login-content {
transform: translateY(40px) scale(0.88);
transform-origin: center top;
    }
.phone-text {
text-align: center;
font-size: 30px;
color: #222;
font-weight: 500;
margin-bottom: 15px;
    }
.btn-onekey {
width: 100%;
padding: 16px;
border-radius: 999px;
border: none;
background: linear-gradient(90deg, #f06898, #f478a8);
color: #fff;
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
cursor: pointer;
margin-bottom: 20px;
box-shadow: 0 10px 24px rgba(240, 88, 136, 0.28);
    }
/* svg图标大小 */
.btn-onekey svg {
width:22px;
height:22px;
}
.link-code {
display: block;
text-align: center;
font-size: 17px;
color: #444;
text-decoration: none;
margin-bottom: 36px;
cursor:pointer;
    }
.other-title {
display: flex;
align-items: center;
color: #777;
font-size: 16px;
gap: 14px;
margin-bottom: 28px;
    }
.other-title::before,
.other-title::after {
content: "";
flex: 1;
height: 1px;
background: #ccc;
    }
.social-row {
display: flex;
justify-content: center;
gap: 36px;
margin-bottom: 32px;
    }
.social-item {
width: 60px;
height: 60px;
border-radius: 999px;
display: flex;
align-items: center;
justify-content: center;
font-size: 26px;
color: #fff;
cursor:pointer;
    }
.wx {
background: url('wechat.png') center / contain no-repeat;
background-color: transparent;
}
.qq {
background: url('qq.png') center / contain no-repeat;
background-color: transparent;
    }
.apple {
background: url('apple.png') center / contain no-repeat;
background-color: transparent;
    }
/* 协议区域：复选框和文字垂直居中 */
.agree-box {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
font-size: 15px;
color: #666;
line-height: 1.4;
margin-bottom: 10px;
    }
.agree-box a {
color: #f06898;
text-decoration: none;
cursor:pointer;
    }
/* 将复选框改为圆形单选样式 */
.agree-box input[type="checkbox"] {
appearance: none;
-webkit-appearance: none;
width: 18px;
height: 18px;
border: 1px solid #999;
border-radius: 50%;
outline: none;
margin-top: 0;
position: relative;
cursor: pointer;
    }
.agree-box input[type="checkbox"]:checked::after {
content: "";
width: 9px;
height: 9px;
background-color: #f06898;
border-radius: 50%;
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
    }
/* 普通toast弹窗 */
.toast {
position: fixed;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
background-color: rgba(0,0,0,0.65);
color: #fff;
padding: 16px 24px;
border-radius: 12px;
font-size:16px;
z-index:9999;
display:none;
max-width:80%;
text-align:center;
}
/* 协议弹窗通用样式 */
.modal-mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:10000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal-box{
    width:100%;
    max-width:360px;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
}
.modal-header{
    padding:16px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #eee;
}
.modal-body{
    padding:20px 16px;
    min-height:160px;
    font-size:15px;
    color:#444;
}
.modal-footer{
    display:flex;
    gap:12px;
    padding:16px;
}
.modal-footer button{
    flex:1;
    padding:12px 0;
    border-radius:999px;
    border:none;
    font-size:16px;
    cursor:pointer;
}
.btn-accept{
    background:#f06898;
    color:#fff;
}
.btn-accept:disabled{
    background:#f8b3c8;
    cursor:not-allowed;
}
.btn-cancel{
    background:#eee;
    color:#333;
}
/* 缺少条款提示弹窗 */
.alert-mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:10001;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.alert-box{
    width:100%;
    max-width:340px;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
}
.alert-body{
    padding:24px 20px;
    font-size:16px;
    color:#333;
    line-height:1.6;
}
.alert-footer{
    display:flex;
    gap:12px;
    padding:0 20px 20px;
}
.alert-footer button{
    flex:1;
    padding:12px 0;
    border-radius:999px;
    border:none;
    font-size:16px;
    cursor:pointer;
}
.alert-confirm{
    background:#f06898;
    color:#fff;
}
.alert-cancel{
    background:#eee;
    color:#333;
}

@media (max-height:740px){
.title h1 {font-size: 48px;}
.title p {font-size:18px;}
.phone-text {font-size:38px;margin-bottom:22px;}
.btn-onekey {padding:14px;font-size:17px;}
.login-content {transform: translateY(35px) scale(0.88);}
.social-item {width:54px;height:54px;font-size:23px;}
.social-row {gap:30px;margin-bottom:26px;}
.other-title {font-size:15px;margin-bottom:22px;}
.link-code {font-size:16px;margin-bottom:30px;}
.agree-box {font-size:14px;}
.agree-box input[type="checkbox"] {width:16px;height:16px;margin-top:0;}
.agree-box input[type="checkbox"]:checked::after {width:8px;height:8px;}
    }
@media (max-height:660px){
.title h1 {font-size: 42px;}
.title p {font-size:16px;}
.phone-text {font-size:32px;margin-bottom:18px;}
.btn-onekey {padding:12px;font-size:15px;}
.login-content {transform: translateY(30px) scale(0.88);}
.social-row {gap:24px;margin-bottom:20px;}
.social-item {width:48px;height:48px;font-size:20px;}
.other-title {font-size:14px;margin-bottom:18px;}
.link-code {font-size:14px;margin-bottom:22px;}
.agree-box {font-size:13px;line-height:1.35;}
.agree-box input[type="checkbox"] {width:15px;height:15px;margin-top:0;}
.agree-box input[type="checkbox"]:checked::after {width:7px;height:7px;}
    }
@media (max-height:580px){
.title h1 {font-size: 36px;}
.title p {font-size:15px;}
.phone-text {font-size:28px;margin-bottom:14px;}
.btn-onekey {padding:10px;font-size:14px;}
.login-content {transform: translateY(25px) scale(0.88);}
.social-row {gap:20px;margin-bottom:16px;}
.social-item {width:42px;height:42px;font-size:18px;}
.other-title {font-size:13px;margin-bottom:14px;}
.link-code {font-size:13px;margin-bottom:18px;}
.agree-box {font-size:12px;line-height:1.3;}
.agree-box input[type="checkbox"] {width:14px;height:14px;margin-top:0;}
.agree-box input[type="checkbox"]:checked::after {width:6px;height:6px;}
    }
@media (max-width: 420px) {
.title h1 {font-size: 48px;}
.social-row {gap: 28px;}
.social-item {width: 54px;height: 54px;font-size: 24px;}
    }
@media (max-width: 360px) {
.title h1 {font-size: 42px;}
.phone-text {font-size: 34px;}
    }
</style>
</head>
<body>
<div class="login-wrap">
<a href="#" class="close-btn">×</a>
<div class="title">
<h1>Hello!</h1>
<p>欢迎来到潮汐日记</p>
</div>
<div class="space"></div>
<div class="login-content">
<div class="phone-text">手机号码获取中...</div>
<button class="btn-onekey" id="btnOneKey">
<svg viewBox="0 0 24 24">
<rect x="4.5" y="1.5" width="15" height="21" rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="12" y1="19" x2="12" y2="19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
<span>本机号码一键登录</span>
</button>
<a class="link-code" id="linkCode">手机验证码登录 &gt;</a>
<div class="other-title">其他登录方式</div>
<div class="social-row">
<div class="social-item wx" id="wxLogin"></div>
<div class="social-item qq" id="qqLogin"></div>
<div class="social-item apple" id="appleLogin"></div>
</div>
<div class="agree-box">
<input type="checkbox" id="agreeCheck" />
<label for="agreeCheck">
                    我已阅读并同意<a class="protocol-link" data-title="用户协议">用户协议</a>、<a class="protocol-link" data-title="隐私政策">隐私政策</a>、<a class="protocol-link" data-title="认证服务条款">认证服务条款</a>
</label>
</div>
</div>
</div>
<!-- 全局toast弹窗 -->
<div class="toast" id="toastBox"></div>

<!-- 协议共用弹窗 -->
<div class="modal-mask" id="protocolModal">
    <div class="modal-box">
        <div class="modal-header" id="modalTitle">用户协议</div>
        <div class="modal-body" id="modalBody">
            <!-- 内容留空，在这里填入对应协议文本 -->
        </div>
        <div class="modal-footer">
            <button class="btn-accept" id="acceptBtn">同意并接受(10s)</button>
            <button class="btn-cancel" id="cancelBtn">取消</button>
        </div>
    </div>
</div>

<!-- 缺少条款提醒弹窗 -->
<div class="alert-mask" id="alertModal">
    <div class="alert-box">
        <div class="alert-body" id="alertText"></div>
        <div class="alert-footer">
            <button class="alert-confirm" id="alertConfirmBtn">确认</button>
            <button class="alert-cancel" id="alertCancelBtn">取消</button>
        </div>
    </div>
</div>

<script>
const toastBox = document.getElementById('toastBox');
const protocolModal = document.getElementById('protocolModal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const acceptBtn = document.getElementById('acceptBtn');
const cancelBtn = document.getElementById('cancelBtn');
const agreeCheck = document.getElementById('agreeCheck');
//提醒弹窗
const alertModal = document.getElementById('alertModal');
const alertText = document.getElementById('alertText');
const alertConfirmBtn = document.getElementById('alertConfirmBtn');
const alertCancelBtn = document.getElementById('alertCancelBtn');

let timer = null;
// 协议顺序
const protocolList = ["用户协议", "隐私政策", "认证服务条款"];
// 记录三个协议是否已同意
let agreeState = {
    "用户协议": false,
    "隐私政策": false,
    "认证服务条款": false
};

//显示toast弹窗
function showToast(msg, duration){
toastBox.innerText = msg;
toastBox.style.display = "block";
setTimeout(()=>{
toastBox.style.display = "none";
    },duration)
}
// 获取还没有同意的协议数组
function getUnAgreeProtocolList(){
    return protocolList.filter(item=>!agreeState[item]);
}
//打开指定协议弹窗
function openProtocolModal(titleText){
    modalTitle.innerText = titleText;
    modalBody.innerText = "";
    protocolModal.style.display = 'flex';
    acceptBtn.disabled = true;
    let count = 10;
    acceptBtn.innerText = `同意并接受(${count}s)`;
    if(timer) clearInterval(timer);
    timer = setInterval(()=>{
        count--;
        acceptBtn.innerText = `同意并接受(${count}s)`;
        if(count <= 0){
            clearInterval(timer);
            acceptBtn.innerText = "同意并接受";
            acceptBtn.disabled = false;
        }
    },1000);
}

//一键登录 和 第三方图标 弹出 3秒 开发中
document.getElementById('btnOneKey').addEventListener('click',()=>{
showToast("本机号码一键登陆功能还在开发中",3000);
})
document.getElementById('wxLogin').addEventListener('click',()=>{
showToast("微信登陆功能还在开发中",3000);
})
document.getElementById('qqLogin').addEventListener('click',()=>{
showToast("QQ登陆该功能还在开发中",3000);
})
document.getElementById('appleLogin').addEventListener('click',()=>{
showToast("APPLE ID 登陆该功能还在开发中",3000);
})
//手机验证码登录
document.getElementById('linkCode').addEventListener('click',()=>{
if(!agreeCheck.checked){
showToast("如需继续使用本软件请阅读并同意用户协议、隐私政策、认证服务条款，否则无法继续使用",5000);
    }else{
window.location.href = "手机号输入页.html";
    }
})

//点击协议文字，开始依次阅读流程
document.querySelectorAll('.protocol-link').forEach(item=>{
    item.addEventListener('click', function(e){
        e.preventDefault();
        const unAgreeList = getUnAgreeProtocolList();
        if(unAgreeList.length >0){
            openProtocolModal(unAgreeList[0]);
        }
    })
})

//协议弹窗【同意】
acceptBtn.onclick = function(){
    const currentTitle = modalTitle.innerText;
    agreeState[currentTitle] = true;
    clearInterval(timer);
    const unAgreeList = getUnAgreeProtocolList();
    if(unAgreeList.length >0){
        openProtocolModal(unAgreeList[0]);
    }else{
        protocolModal.style.display = 'none';
        agreeCheck.checked = true;
    }
}
//协议弹窗【取消】
cancelBtn.onclick = function(){
    protocolModal.style.display = 'none';
    clearInterval(timer);
}
//点击遮罩关闭协议弹窗
protocolModal.addEventListener('click',function(e){
    if(e.target === protocolModal){
        protocolModal.style.display = 'none';
        clearInterval(timer);
    }
})

//点击复选框
agreeCheck.addEventListener('click',function(e){
    const unAgreeList = getUnAgreeProtocolList();
    if(unAgreeList.length ===0){
        //全部同意，正常勾选
        return true;
    }
    e.preventDefault();
    // 判断是全部未同意，还是部分未同意
    if(unAgreeList.length === protocolList.length){
        alertText.innerText = `请先阅读并同意【用户协议、隐私政策、认证服务条款】，否则无法继续使用。是否现在阅读？`;
    }else{
        alertText.innerText = `您还有【${unAgreeList.join('、')}】未阅读并同意，是否现在阅读？`;
    }
    alertModal.style.display = 'flex';
})
//提醒弹窗-取消按钮
alertCancelBtn.onclick = function(){
    alertModal.style.display = 'none';
}
//提醒弹窗-确认按钮，直接打开第一条未阅读协议
alertConfirmBtn.onclick = function(){
    alertModal.style.display = 'none';
    const unAgreeList = getUnAgreeProtocolList();
    if(unAgreeList.length>0){
        openProtocolModal(unAgreeList[0]);
    }
}
//点击提醒弹窗遮罩关闭
alertModal.addEventListener('click',function(e){
    if(e.target === alertModal){
        alertModal.style.display = 'none';
    }
})
</script>
</body>
</html>
