<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>潮汐日记 - 登录</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
html, body {
height: 100vh;
height: 100svh;
overflow: hidden;
    }
body {
background:
url('bg1.jpg') center top / cover no-repeat,
linear-gradient(160deg, #f8d2e0, #e1eaf8, #ffffff, #fce4ec);
padding: 24px;
padding-bottom: calc(24px + env(safe-area-inset-bottom));
position: relative;
    }
body::before {
content: "";
position: absolute;
inset: 0;
background: url('girl.png') center top / contain no-repeat;
background-position: 50% 6%;
pointer-events: none;
z-index: 0;
    }
.login-wrap {
height: 100%;
max-width: 420px;
margin: 0 auto;
position: relative;
z-index: 1;
display: flex;
flex-direction: column;
    }
.close-btn {
font-size: 32px;
color: #d86898;
text-decoration: none;
margin-bottom: 16px;
    }
.title h1 {
font-size: 56px;
font-weight: 600;
color: #222;
line-height: 1.1;
    }
.title p {
font-size: 20px;
color: #333;
margin-top: 6px;
    }
.space {
flex: 1;
min-height: 60px;
    }
/* 下调 translateY，防止底部内容被裁切 */
.login-content {
transform: translateY(30px) scale(0.88);
transform-origin: center top;
    }
.phone-text {
text-align: center;
font-size: 44px;
color: #222;
font-weight: 500;
margin-bottom: 28px;
    }
.btn-onekey {
width: 100%;
padding: 16px;
border-radius: 999px;
border: none;
background: linear-gradient(90deg, #f06898, #f478a8);
color: #fff;
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
cursor: pointer;
margin-bottom: 20px;
box-shadow: 0 10px 24px rgba(240, 88, 136, 0.28);
    }
/* svg图标大小 */
.btn-onekey svg {
width:22px;
height:22px;
}
.link-code {
display: block;
text-align: center;
font-size: 17px;
color: #444;
text-decoration: none;
margin-bottom: 36px;
cursor:pointer;
    }
.other-title {
display: flex;
align-items: center;
color: #777;
font-size: 16px;
gap: 14px;
margin-bottom: 28px;
    }
.other-title::before,
.other-title::after {
content: "";
flex: 1;
height: 1px;
background: #ccc;
    }
.social-row {
display: flex;
justify-content: center;
gap: 36px;
margin-bottom: 32px;
    }
.social-item {
width: 60px;
height: 60px;
border-radius: 999px;
display: flex;
align-items: center;
justify-content: center;
font-size: 26px;
color: #fff;
cursor:pointer;
    }
.wx {
background: url('wechat.png') center / contain no-repeat;
background-color: transparent;
}
.qq {
background: url('qq.png') center / contain no-repeat;
background-color: transparent;
    }
.apple {
background: url('apple.png') center / contain no-repeat;
background-color: transparent;
    }
/* 协议区域改为水平居中 */
.agree-box {
display: flex;
align-items: flex-start;
justify-content: center;
gap: 8px;
font-size: 15px;
color: #666;
line-height: 1.4;
margin-bottom: 10px;
    }
.agree-box a {
color: #f05888;
text-decoration: none;
    }
/* 将复选框改为圆形单选样式 */
.agree-box input[type="checkbox"] {
appearance: none;
-webkit-appearance: none;
width: 18px;
height: 18px;
border: 1px solid #999;
border-radius: 50%;
outline: none;
margin-top: 3px;
position: relative;
cursor: pointer;
    }
.agree-box input[type="checkbox"]:checked::after {
content: "";
width: 9px;
height: 9px;
background-color: #f06898;
border-radius: 50%;
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
    }
/* 弹窗样式 */
.toast {
position: fixed;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
background-color: rgba(0,0,0,0.65);
color: #fff;
padding: 16px 24px;
border-radius: 12px;
font-size:16px;
z-index:9999;
display:none;
max-width:80%;
text-align:center;
}
@media (max-height:740px){
.title h1 {font-size: 48px;}
.title p {font-size:18px;}
.phone-text {font-size:38px;margin-bottom:22px;}
.btn-onekey {padding:14px;font-size:17px;}
.login-content {transform: translateY(25px) scale(0.88);}
.social-item {width:54px;height:54px;font-size:23px;}
.social-row {gap:30px;margin-bottom:26px;}
.other-title {font-size:15px;margin-bottom:22px;}
.link-code {font-size:16px;margin-bottom:30px;}
.agree-box {font-size:14px;}
.agree-box input[type="checkbox"] {width:16px;height:16px;}
.agree-box input[type="checkbox"]:checked::after {width:8px;height:8px;}
    }
@media (max-height:660px){
.title h1 {font-size: 42px;}
.title p {font-size:16px;}
.phone-text {font-size:32px;margin-bottom:18px;}
.btn-onekey {padding:12px;font-size:15px;}
.login-content {transform: translateY(20px) scale(0.88);}
.social-row {gap:24px;margin-bottom:20px;}
.social-item {width:48px;height:48px;font-size:20px;}
.other-title {font-size:14px;margin-bottom:18px;}
.link-code {font-size:14px;margin-bottom:22px;}
.agree-box {font-size:13px;line-height:1.35;}
.agree-box input[type="checkbox"] {width:15px;height:15px;}
.agree-box input[type="checkbox"]:checked::after {width:7px;height:7px;}
    }
@media (max-height:580px){
.title h1 {font-size: 36px;}
.title p {font-size:15px;}
.phone-text {font-size:28px;margin-bottom:14px;}
.btn-onekey {padding:10px;font-size:14px;}
.login-content {transform: translateY(15px) scale(0.88);}
.social-row {gap:20px;margin-bottom:16px;}
.social-item {width:42px;height:42px;font-size:18px;}
.other-title {font-size:13px;margin-bottom:14px;}
.link-code {font-size:13px;margin-bottom:18px;}
.agree-box {font-size:12px;line-height:1.3;}
.agree-box input[type="checkbox"] {width:14px;height:14px;}
.agree-box input[type="checkbox"]:checked::after {width:6px;height:6px;}
    }
@media (max-width: 420px) {
.title h1 {font-size: 48px;}
.social-row {gap: 28px;}
.social-item {width: 54px;height: 54px;font-size: 24px;}
    }
@media (max-width: 360px) {
.title h1 {font-size: 42px;}
.phone-text {font-size: 34px;}
    }
</style>
</head>
<body>
<div class="login-wrap">
<a href="#" class="close-btn">×</a>
<div class="title">
<h1>Hello!</h1>
<p>欢迎来到潮汐日记</p>
</div>
<div class="space"></div>
<div class="login-content">
<div class="phone-text">手机号码获取中...</div>
<button class="btn-onekey" id="btnOneKey">
<svg viewBox="0 0 24 24">
<rect x="4.5" y="1.5" width="15" height="21" rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="12" y1="19" x2="12" y2="19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
<span>本机号码一键登录</span>
</button>
<a class="link-code" id="linkCode">手机验证码登录 &gt;</a>
<div class="other-title">其他登录方式</div>
<div class="social-row">
<div class="social-item wx" id="wxLogin"></div>
<div class="social-item qq" id="qqLogin"></div>
<div class="social-item apple" id="appleLogin"></div>
</div>
<div class="agree-box">
<input type="checkbox" id="agreeCheck" />
<label for="agreeCheck">
                    我已阅读并同意<a href="#">用户协议</a>、<a href="#">隐私政策</a>、
<br />
<a href="#">认证服务条款</a>
</label>
</div>
</div>
</div>
<!-- 全局弹窗 -->
<div class="toast" id="toastBox"></div>
<script>
const toastBox = document.getElementById('toastBox');
//显示toast弹窗
function showToast(msg, duration){
toastBox.innerText = msg;
toastBox.style.display = "block";
setTimeout(()=>{
toastBox.style.display = "none";
    },duration)
}
//一键登录 和 第三方图标 弹出 3秒 开发中
document.getElementById('btnOneKey').addEventListener('click',()=>{
showToast("本机号码一键登陆功能还在开发中",3000);
})
document.getElementById('wxLogin').addEventListener('click',()=>{
showToast("微信登陆功能还在开发中",3000);
})
document.getElementById('qqLogin').addEventListener('click',()=>{
showToast("QQ登陆该功能还在开发中",3000);
})
document.getElementById('appleLogin').addEventListener('click',()=>{
showToast("APPLE ID 登陆该功能还在开发中",3000);
})
//手机验证码登录
document.getElementById('linkCode').addEventListener('click',()=>{
const checkBox = document.getElementById('agreeCheck');
if(!checkBox.checked){
showToast("如需继续使用本软件请阅读并同意用户协议、隐私政策、认证服务条款，否则无法继续使用",5000);
    }else{
//勾选成功，跳转页面
window.location.href = "手机号输入页.html";
    }
})
</script>
</body>
</html>
