<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>登录</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
-webkit-tap-highlight-color: transparent;
}
html, body {
height: 100svh;
overflow: hidden;
}
body {
background:
url('girl.png') center top / contain no-repeat,
linear-gradient(160deg, #f8d2e0, #e1eaf8, #ffffff, #fce4ec);
padding: 24px;
padding-bottom: calc(24px + env(safe-area-inset-bottom));
position: relative;
}
/* ========== 卡通小人：完全保留原样，大小、位置固定不动 ========== */
body::before {
content: "";
position: absolute;
left: 0;
top: 0;
width: 100%;
height: 100%;
background: url('girl.png') center top / contain no-repeat;
pointer-events: none;
z-index: 0;
}
.login-wrap {
height: 100%;
max-width: 420px;
margin: 0 auto;
position: relative;
z-index: 1;
display: flex;
flex-direction: column;
}
.top-title {
flex: 0 0 auto;
}
.close-btn {
font-size: 32px;
color: #d86898;
text-decoration: none;
margin-bottom: 16px;
display:inline-block;
}
.title h1 {
font-size: clamp(32px, 7vw, 56px);
font-weight: 600;
color: #222;
line-height: 1.1;
}
.title p {
font-size: clamp(16px,3vw,20px);
color: #333;
margin-top: 6px;
}
/* 中间空白占位，隔开小人与底部登录区，保证不会覆盖小人 */
.space-gap{
flex:1;
min-height:120px;
}
/* ========== 仅底部登录区域做响应式，屏幕高度变化只缩放这一块 ========== */
.login-content {
flex:0 0 auto;
}
.phone-text {
text-align: center;
font-size: 26px;
color: #222;
font-weight: 500;
margin-bottom: 15px;
}
.btn-onekey {
width: 100%;
padding:16px;
border-radius: 999px;
border: none;
background: linear-gradient(90deg, #f06898, #f478a8);
color: #fff;
font-size:18px;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
cursor: pointer;
margin-bottom: 20px;
box-shadow: 0 10px 24px rgba(240, 88, 136, 0.28);
}
.btn-onekey:active{
background: #f8b3c8 !important;
}
.btn-onekey svg {
width:22px;
height:22px;
}
.link-code-wrap{
text-align:center;
margin-bottom: 36px;
}
.link-code {
display: inline-block;
font-size:17px;
color: #444;
text-decoration: none;
cursor:pointer;
padding:4px 8px;
border-radius:8px;
}
.link-code:active{
background: rgba(0,0,0,0.06);
}
.other-title {
display: flex;
align-items: center;
color: #777;
font-size:16px;
gap: 14px;
margin-bottom: 28px;
}
.other-title::before,
.other-title::after {
content: "";
flex: 1;
height: 1px;
background: #ccc;
}
.social-row {
display: flex;
justify-content: center;
gap:36px;
margin-bottom: 32px;
}
.social-item {
width:60px;
height:60px;
border-radius: 999px;
display: flex;
align-items: center;
justify-content: center;
font-size: 26px;
color: #fff;
cursor:pointer;
}
.wx {
background: url('wechat.png') center / contain no-repeat;
background-color: transparent;
}
.qq {
background: url('qq.png') center / contain no-repeat;
background-color: transparent;
}
.apple {
background: url('apple.png') center / contain no-repeat;
background-color: transparent;
}
/* ========= 协议行修改：单行不换行，字体自适应，复选框禁止变形 ========= */
.agree-box {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
font-size: clamp(11px,3.2vw,15px);
color: #666;
line-height: 1.4;
margin-bottom: 10px;
white-space: nowrap;
overflow: hidden;
}
.agree-box a {
color: #f06898;
text-decoration: none;
cursor:pointer;
}
.agree-box input[type="checkbox"] {
appearance: none;
-webkit-appearance: none;
width: 18px;
height: 18px;
border: 1px solid #999;
border-radius: 50%;
outline: none;
margin-top: 0;
position: relative;
cursor: pointer;
flex-shrink: 0; /* 关键：禁止复选框压缩变形，永远保持18px正圆 */
}
.agree-box input[type="checkbox"]:checked::after {
content: "";
width: 9px;
height: 9px;
background-color: #f06898;
border-radius: 50%;
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
}
/* ===== 屏幕高度变小时，只压缩底部登录区域样式，小人完全不受影响 ===== */
@media (max-height: 740px) {
.phone-text { font-size: 24px; margin-bottom: 12px; }
.btn-onekey { padding:13px; font-size:16px; margin-bottom:16px; }
.link-code { font-size:15px; }
.link-code-wrap { margin-bottom:28px; }
.other-title { font-size:14px; margin-bottom:20px; }
.social-item { width:52px;height:52px; }
.social-row { gap:28px;margin-bottom:24px; }
}
@media (max-height: 660px) {
.phone-text { font-size: 22px; margin-bottom: 10px; }
.btn-onekey { padding:11px; font-size:15px; margin-bottom:14px; }
.link-code { font-size:14px; }
.link-code-wrap { margin-bottom:22px; }
.other-title { font-size:13px; margin-bottom:16px; }
.social-item { width:48px;height:48px; }
.social-row { gap:24px;margin-bottom:20px; }
}
@media (max-height: 580px) {
.phone-text { font-size: 20px; margin-bottom: 8px; }
.btn-onekey { padding:10px; font-size:14px; margin-bottom:12px; }
.link-code { font-size:13px; }
.link-code-wrap { margin-bottom:18px; }
.other-title { font-size:12px; margin-bottom:14px; }
.social-item { width:44px;height:44px; }
.social-row { gap:20px;margin-bottom:16px; }
}
/* 弹窗样式 */
.toast {
position: fixed;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
background-color: rgba(0,0,0,0.65);
color: #fff;
padding: 16px 24px;
border-radius: 12px;
font-size:16px;
z-index:9999;
display:none;
max-width:80%;
text-align:center;
}
.modal-mask{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:10000;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}
.modal-box{
width:100%;
max-width:360px;
background:#fff;
border-radius:16px;
overflow:hidden;
position:relative;
}
.modal-close{
position:absolute;
right:16px;
top:14px;
font-size:24px;
color:#666;
cursor:pointer;
}
.modal-header{
padding:16px;
text-align:center;
font-size:18px;
font-weight:bold;
border-bottom:1px solid #eee;
}
.modal-body{
padding:20px 16px;
min-height:160px;
font-size:15px;
color:#444;
}
.modal-footer{
display:flex;
gap:12px;
padding:16px;
}
.modal-footer button{
flex:1;
padding:12px 0;
border-radius:999px;
border:none;
font-size:16px;
cursor:pointer;
}
.btn-accept{
background:#f06898;
color:#fff;
}
.btn-accept:disabled{
background:#f8b3c8;
cursor:not-allowed;
}
.btn-refuse{
background:#eee;
color:#333;
}
.alert-mask{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:10001;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}
.alert-box{
width:100%;
max-width:340px;
background:#fff;
border-radius:16px;
overflow:hidden;
}
.alert-body{
padding:24px 20px;
font-size:16px;
color:#333;
line-height:1.6;
}
.alert-footer{
display:flex;
gap:12px;
padding:0 20px 20px;
}
.alert-footer button{
flex:1;
padding:12px 0;
border-radius:999px;
border:none;
font-size:16px;
cursor:pointer;
}
.alert-confirm{
background:#f06898;
color:#fff;
}
.alert-cancel{
background:#eee;
color:#333;
}
</style>
</head>
<body>
<div class="login-wrap">
<div class="top-title">
<a href="#" class="close-btn">×</a>
<div class="title">
<h1>Hello!</h1>
<p>欢迎来到潮汐日记</p>
</div>
</div>
<!-- 空白间隔，固定隔开卡通人物和底部登录区，防止覆盖 -->
<div class="space-gap"></div>
<!-- 底部登录区：仅这一块做屏幕高度自适应 -->
<div class="login-content">
<div class="phone-text">手机号码获取中...</div>
<button class="btn-onekey" id="btnOneKey">
<svg viewBox="0 0 24 24">
<rect x="4.5" y="1.5" width="15" height="21" rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="12" y1="19" x2="12" y2="19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
<span>本机号码一键登录</span>
</button>
<div class="link-code-wrap">
<span class="link-code" id="linkCode">手机验证码登录 &gt;</span>
</div>
<div class="other-title">其他登录方式</div>
<div class="social-row">
<div class="social-item wx" id="wxLogin"></div>
<div class="social-item qq" id="qqLogin"></div>
<div class="social-item apple" id="appleLogin"></div>
</div>
<div class="agree-box">
<input type="checkbox" id="agreeCheck" />
<label for="agreeCheck">
                我已阅读并同意<a class="protocol-link" data-title="用户协议">用户协议</a>、<a class="protocol-link" data-title="隐私政策">隐私政策</a>、<a class="protocol-link" data-title="认证服务条款">认证服务条款</a>
</label>
</div>
</div>
</div>
<div class="toast" id="toastBox"></div>
<div class="modal-mask" id="protocolModal">
<div class="modal-box">
<span class="modal-close" id="modalClose">×</span>
<div class="modal-header" id="modalTitle">用户协议</div>
<div class="modal-body" id="modalBody">协议内容</div>
<div class="modal-footer">
<button class="btn-accept" id="acceptBtn">同意并接受(10s)</button>
<button class="btn-refuse" id="refuseBtn">不同意</button>
</div>
</div>
</div>
<div class="alert-mask" id="alertModal">
<div class="alert-box">
<div class="alert-body" id="alertText"></div>
<div class="alert-footer">
<button class="alert-confirm" id="alertConfirmBtn">确认</button>
<button class="alert-cancel" id="alertCancelBtn">取消</button>
</div>
</div>
</div>
<script>
const toastBox = document.getElementById('toastBox');
const protocolModal = document.getElementById('protocolModal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const acceptBtn = document.getElementById('acceptBtn');
const refuseBtn = document.getElementById('refuseBtn');
const modalClose = document.getElementById('modalClose');
const agreeCheck = document.getElementById('agreeCheck');
const alertModal = document.getElementById('alertModal');
const alertText = document.getElementById('alertText');
const alertConfirmBtn = document.getElementById('alertConfirmBtn');
const alertCancelBtn = document.getElementById('alertCancelBtn');
let timer = null;
let currentProtocolName = '';
const protocolList = ["用户协议", "隐私政策", "认证服务条款"];
let agreeState = {
"用户协议": false,
"隐私政策": false,
"认证服务条款": false
};
function showToast(msg, duration){
toastBox.innerText = msg;
toastBox.style.display = "block";
setTimeout(()=>{toastBox.style.display = "none";},duration)
}
function getUnAgreeProtocolList(){
return protocolList.filter(item=>!agreeState[item]);
}
function openProtocolModal(titleText){
currentProtocolName = titleText;
modalTitle.innerText = titleText;
modalBody.innerText = titleText + " 协议内容";
protocolModal.style.display = 'flex';
if(agreeState[titleText]){
acceptBtn.innerText = "您已同意并接受";
acceptBtn.disabled = true;
    }else{
acceptBtn.disabled = true;
let count = 10;
acceptBtn.innerText = `同意并接受(${count}s)`;
if(timer) clearInterval(timer);
timer = setInterval(()=>{
count--;
acceptBtn.innerText = `同意并接受(${count}s)`;
if(count <= 0){
clearInterval(timer);
acceptBtn.innerText = "同意并接受";
acceptBtn.disabled = false;
            }
        },1000);
    }
}
function closeProtocolModal(){
protocolModal.style.display = 'none';
if(timer) clearInterval(timer);
}
document.getElementById('btnOneKey').addEventListener('click',()=>showToast("本机号码一键登陆功能，正在开发中",3000));
document.getElementById('wxLogin').addEventListener('click',()=>showToast("微信登陆功能，正在开发中",3000));
document.getElementById('qqLogin').addEventListener('click',()=>showToast("QQ登陆功能，正在开发中",3000));
document.getElementById('appleLogin').addEventListener('click',()=>showToast("APPLE ID 登陆该功能，正在开发中",3000));
document.getElementById('linkCode').addEventListener('click',()=>{
if(!agreeCheck.checked){
showToast("如需继续使用本软件请阅读并同意【用户协议、隐私政策、认证服务条款】，否则无法继续使用",5000);
}else{
window.location.href = "手机号输入页.html";
}
})
document.querySelectorAll('.protocol-link').forEach(item=>{
item.addEventListener('click', function(e){
e.preventDefault();
openProtocolModal(this.dataset.title);
    })
})
modalClose.onclick = closeProtocolModal;
protocolModal.addEventListener('click',e=>{if(e.target === protocolModal) closeProtocolModal()})
acceptBtn.onclick = function(){
if(agreeState[currentProtocolName]) return;
agreeState[currentProtocolName] = true;
clearInterval(timer);
const unAgreeList = getUnAgreeProtocolList();
if(unAgreeList.length >0){
openProtocolModal(unAgreeList[0]);
    }else{
closeProtocolModal();
agreeCheck.checked = true;
    }
}
refuseBtn.onclick = function(){
agreeState[currentProtocolName] = false;
agreeCheck.checked = false;
closeProtocolModal();
showToast(`你已取消同意并接受【${currentProtocolName}】，将无法继续使用，如需再次使用需重新阅读相关协议同意并接受`,5000);
}
agreeCheck.addEventListener('click',function(e){
const unAgreeList = getUnAgreeProtocolList();
if(unAgreeList.length ===0) return true;
e.preventDefault();
if(unAgreeList.length === protocolList.length){
alertText.innerText = `请先阅读并同意【用户协议、隐私政策、认证服务条款】，否则无法继续使用。是否现在阅读？`;
    }else{
alertText.innerText = `您还有【${unAgreeList.join('、')}】未阅读并同意，是否现在阅读？`;
    }
alertModal.style.display = 'flex';
})
alertCancelBtn.onclick = ()=>alertModal.style.display = 'none';
alertConfirmBtn.onclick = function(){
alertModal.style.display = 'none';
const unAgreeList = getUnAgreeProtocolList();
if(unAgreeList.length>0) openProtocolModal(unAgreeList[0]);
}
alertModal.addEventListener('click',e=>{if(e.target === alertModal) alertModal.style.display = 'none'})
</script>
</body>
</html>
